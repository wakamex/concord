[project]
name = "concord"
version = "0.0.0"
description = "Matching recompilation for x86-64 and C++: search for source that recompiles byte-identical to a target."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "capstone>=5.0.9",
    "pyelftools>=0.33",
    "tree-sitter>=0.26.0",
    "tree-sitter-cpp>=0.23.4",
]

[project.scripts]
concord = "concord.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concord"]
