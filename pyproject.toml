[project]
name = "concord"
version = "0.0.0"
description = "Matching recompilation for x86-64 and C++: search for source that recompiles byte-identical to a target."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
concord = "concord.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concord"]
