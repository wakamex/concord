  { function = "Remaining unit functions", note = "secondInit stays at objdiff 99.39509 after 64 permute overlays, with the first differing instruction at +0x698 and no callee or immediate difference. initializeNewGame stays at 99.77819 on the previously recorded lea/add difference; updateState at 96.90249 retains the previously recorded highscore branch-shape problem; renderMinimap at 88.927734 retains its materialized 0xffff2020 color-store difference. Other body residuals have no calls-constants signal beyond frame sizes: buyBuildingAtPlacementPos 99.213486 has two comparison flips; writeStateToFile 99.47802 and setWaveListToggle 99.35185 have register-choice differences; buildingShiftSelected 87.520546 has block-order differences; addParticleEntity 93.9881 has instruction-selection differences; playParticleSound 80.5814 has a comparison flip and register-choice differences; sellEntity 90.48572 and sellAllHarvesters 62.272728 differ in frame and register choices. The inexact wide-string constructor copy is 95.74074. No missing gameplay operation is established for these functions by the census, and no source change is retained for them." },
