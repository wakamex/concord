[[idiom]]
id = "a1r5g5b5-alpha-bool-flag"
cause = "instruction-selection"
status = "confirmed"
symptom = "the target materializes a colour's alpha byte as a 0/1 flag shifted left 15 (`test 0xff000000; setne al; shl eax,0xf`) where our free helper's `(c & 0xff000000) ? 0x8000 : 0` folds into `cmp eax,1; sbb; not; and dx,0x8000`, and its blue channel uses `sar` where ours shifts unsigned"
fix = "Spell the A1R5G5B5 packing as `unsigned int c = color; unsigned int alpha = (c & 0xff000000) != 0; (alpha << 15) | ((c >> 9) & 0x7c00) | ((c >> 6) & 0x3e0) | (((int)c >> 3) & 0x1f)`. The named unsigned flag expands through store_flag as xor/test/setne in SImode, the unsigned input gives the logical shr for red and green, and the (int) cast keeps the arithmetic sar for blue. A bool local reaches the same setne but routes through movzbl; the shifts as one flat expression without the flag fold back to the sbb sequence."
limits = "At Harvest b9ae04a, the unsigned spelling improves both CVideoSoftware::drawIndexedTriangleList overloads from 97.91042% to 99.80456% with oracle agreement over 5,000 cases each. Changing either overload alone retains the other overload's matched constant claim; changing both loses the claim for four bytes at 0x6115b0. The objects' allocated non-executable sections are byte-identical, including the 32767.0f constant in .rodata.cst4. Both candidates still reference it, but their relocation fields move from function offset 0xb60 to 0xb5f, while Harvest's matcher compares the target at the candidate offset. The target instructions at 0x4f710c and 0x4f7dac reference 0x6115b0. The loss concerns matcher evidence; the capture does not link an executable. A green-before-red spelling for the S3DVertex overload scores 99.79804% but still loses the claim when both overloads change. Naming the combined RGB value in the S3DVertex2TCoords overload lowers it to 96.245926%. No combined spelling among these bounded interventions satisfies the function and data checks in the overlays; other spellings remain untested. The previously reported loss at 0x602a86 was a concord scoring error: the report represents disjoint data ranges by their owner's lowest address and total size, which concord had treated as one contiguous span. The key-name bytes there remain claimed by CSettingsScreen.cpp. GCC 4.4's combine folds `(ne x 0) << 15` to the neg/mask sequence only when the flag is not materialized into an SI pseudo first; whether it folds varies with surrounding register pressure, which is why identical spellings produce test/setne in some functions and sbb in others."
evidence = [
  { commit = "880f8c0", function = "daisy::video::CVideoSoftware::drawIndexedTriangleList(S3DVertex const*)", note = "Target loop body at function offsets ~0x270: `mov 0x18(reg),edx; xor eax,eax; mov edx,ecx; test edx,0xff000000; setne al; shr ecx,9; and ecx,0x7c00; shl eax,0xf; or ecx,eax; mov edx,ecx; shr edx,6; sar ecx,3; and edx,0x3e0; and ecx,0x1f; ors`. The original keeps the alpha bit for any nonzero alpha byte, computed as a bool flag shl 15 beside an Irrlicht-0.7 RGB16 that never sets bit 15 - not the translated free helper's conditional 0x8000 on an unsigned input." },
  { commit = "880f8c0", function = "concord find_function overloads", note = "find_function matched name plus parameter count only and returned the last same-arity definition, so authored edits for one drawIndexedTriangleList overload landed in the other's body. It now compares the demangled parameter types when several overloads share the count." },
  { commit = "b9ae04a", function = "CVideoSoftware data claims", note = "An overlay comparison used all 201 units' hv match evidence and replaced the software-video unit's claims with each compiled candidate. Either unsigned edit alone retains the claim at 0x6115b0-0x6115b4; the two together lose it. Before and after .rodata.cst4 both contain 0000803f00feff46 with SHA-256 62043641f0abfa01582611b58ee586fdcd65a8bff26308e2f555fbf35f6170bb." },
]

