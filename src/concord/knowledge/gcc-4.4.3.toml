[[idiom]]
id = "vtable-slot-count"
cause = "immediate-or-reloc"
status = "confirmed"
symptom = "functions whose bytes match except a reference to a vtable at a different addend, typically constructors and destructors storing a secondary vtable pointer (ours vtable + 0x1c8, the target's + 0x1c0)"
fix = "Make the class declarations give each vtable the original's slots: an extra, missing or misplaced virtual shifts every later slot and every secondary vtable after it. `concord vtables` compares each compiled vtable with the target's slot by slot and names the first slot that differs; a concrete class's own virtuals sit after its interface's, so a function the interface should not declare shows up there."
evidence = [
  { function = "daisy::gui::CGUIListBox destructors", note = "setIconFont and setNumber declared only in CGUIListBox and CGUITab (banteg/harvest#22): three destructors exact, both interface vtables matched" },
]

[[idiom]]
id = "copy-initialized-temporary"
cause = "register-allocation"
status = "hypothesis"
symptom = "a class temporary built inside an expression, such as a map key converted from a const char*, with registers or stack slots that differ around it"
fix = "Name the temporary with copy-initialization, `T name = T(arg);`, before the statement that uses it. GCC 4.4 compiles that differently from both the inline temporary and direct initialization, `T name(arg);`."
before = "AcceptedDragAndDropFileTypes[ox::core::CString<char>(extension)] = accept;"
after = "ox::core::CString<char> extensionString = ox::core::CString<char>(extension); AcceptedDragAndDropFileTypes[extensionString] = accept;"
limits = "One function so far, and a partial gain: the copy-initialized local took CIrrDeviceStub::setAcceptsDragAndDropFileType from 98.33 to 99.44, while the direct-initialized one compiled to the original 98.33 bytes."
evidence = [
  { function = "daisy::CIrrDeviceStub::setAcceptsDragAndDropFileType", note = "concord permute (named-temporary), finished by concord's DWARF-typed temporaries at harvest 2425fe5" },
]

[[idiom]]
id = "declaration-count-phase"
cause = "operand-order"
status = "confirmed"
symptom = "a function's comparison operands swap (cmp ecx, edx for cmp edx, ecx, with the branch condition mirrored) when any declaration is added or removed earlier in the translation unit, such as an unused inline member in a header it includes"
fix = "Leave the body alone and correct the declaration count before it. GCC 4.4 numbers every declaration it parses and keeps a function's variables in a hash table keyed by that number, 31 slots wide for most functions, so the order it visits them in depends on the count modulo 31. `concord phase` compiles a unit with 0 to 30 extra declarations and reports the functions that are exact only at another count (locked: the body is right, the headers declare too few or too many things) and the ones exact only at the present count (witnesses: they stop matching when a header they include changes)."
limits = "The padding is a measurement, not a fix: what a locked function lacks are real declarations of the original headers. A change to a shared header shifts every unit that includes it, so it trades witnesses for locked functions unless the units' counts are corrected together."
evidence = [
  { function = "daisy::video::CSpritePackage::removeAnimationState", note = "exact with 0, 31 and 62 extra declarations and at no other count up to 61; position of the declaration in the unit does not matter (start, middle or end of ox/core/CVector3d.h, or a free template after the class)" },
  { function = "daisy::video::CSpritePackage::addNewImage", note = "exact at every count except 5 and 30 modulo 31" },
]

[[idiom]]
id = "aligned-caller-symbol-learning"
cause = "placement"
status = "confirmed"
symptom = "a template function or its callers stay inexact because the callee has no named target address, while its direct calls align inside inexact callers"
fix = "Use concord learn-calls to collect target destinations from aligned direct calls in named callers. Require every aligned site to agree, every compiled copy to have the target extent's size, and no other symbol to claim the address. Save the result through Harvest's symbol writer with aligned-call evidence, then check whole-build scores before keeping it."
