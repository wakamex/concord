evidence = [
  { function = "Accepted source corrections", note = "At Harvest 99cfd16, authored CMissileTurretEntity::updateLogic changes the spark comparison spelling and moves BurstTime initialization before the Tempest target-coordinate stores, improving the whole-build function score from 72.5625 to 96.328705. A value copy of alien->getPosition() before its reference improves that function from 96.328705 to 97.24306. CMissileEntity::updateLogic orders the squared-distance terms as dy * dy + dx * dx, improving 81.38321 to 81.39084, then nests the owner lookup under the dealDamage condition, improving 81.39084 to 90.13893. findPriorityAlien returns directly when its candidate vector is empty, improving 93.77576 to 97.2303 and reproducing the target's separate cleanup path. Every retained inexact candidate agrees with its previous behavior on 5,000 oracle cases, with zero differences, undefined cases or layout-dependent cases." },
  { function = "Final unit snapshot", note = "The final hv match summary is 73/77 functions exact and exits 1 because four functions remain inexact. The normalized whole-build snapshot reports render 96.11364, findPriorityAlien 97.2303, CMissileEntity::updateLogic 90.13893 and CMissileTurretEntity::updateLogic 97.24306; all four remain unmatched. The whole-build gate against 99cfd16 exits 0 and reports: 3 functions changed: 0 newly matched, 0 worse; data bytes matched: +0 -0. The captured configuration_changes list is empty." },
  { function = "CMissileEntity::updateLogic", note = "At 0x437d50 the target is 2,930 bytes and the candidate remains 2,954 bytes. After the operand-order and nested-condition corrections, residual reports nine block-order rows, 18 instruction-selection rows and 171 register-choice rows. calls-constants reports a target-only compare against 1 at [rbp + 0x40]; the source already performs the same MissileType == 1 check, with a different self register. The remaining mismatch is dominated by register and instruction selection, with no missing enum or signedness check." },
  { function = "CMissileTurretEntity::updateLogic", note = "The authored comparison spelling, Tempest store order and named position value improve the whole-build score to 97.24306. Before the later named-temporary change, residual retains one three-instruction block-order difference and 21 register-choice rows. calls-constants, enum-switch and signedness identify no remaining source-level condition or signedness correction." },
  { function = "CMissileTurretEntity::findPriorityAlien", note = "At 0x436ab0 the direct return from the empty-vector branch improves the whole-build score from 93.77576 to 97.2303 and passes the 5,000-case oracle. The target-only _ZdlPv call is resolved. calls-constants reports the target's mov qword ptr [rsp + 0x58], 0; concord diff aligns it with the candidate's xor r15d, r15d and mov qword ptr [rsp + 0x60], r15 sequence. The source already initializes best = 0 in the corresponding RangeIsImportant branch, so this is a stack-slot difference rather than a missing initialization. Residual shows 16 register-choice rows and two instruction-selection rows, including different stack-slot offsets for loop increments." },
