  { function = "ox::TArray<ox::scene::ISceneNode*> destructor", note = "Eight aligned calls in CSceneManager agree on 0x4c7240, whose target extent and compiled size are both 18 bytes." },
  { function = "ox::TArray<daisy::scene::CSceneManager::MeshEntry> destructor", note = "Two aligned calls in CSceneManager agree on 0x4c8770, whose target extent and compiled size are both 69 bytes." },
  { function = "ox::TArray<daisy::scene::CXFileReader::SXAnimationSet> destructor", note = "An aligned constructor call agrees on 0x599510, whose target extent and compiled size are both 168 bytes. Keeping these three destructor claims gains three exact functions with no function-score or data-byte losses." },
]

