limits = "At Harvest 2fd01e8, the unit has 181/204 exact functions. The retained authored integer promotion makes hookWaveButton exact without lowering another whole-build score. No lossless source correction is established for the larger inlining differences. Two addModsFromFiles body forms fail: += is neutral, and assigning folder.c_str() directly lowers its objdiff score and loses exact copies. Two boolean forms of harvest_isPositionBlocked lower its score. Explicit versus implicit string conversion and a direct array expression versus a named array reference are neutral in both creative-hook functions. Stop those body trials until new evidence identifies a different cause."
evidence = [
  { commit = "2fd01e8", function = "Unit context", note = "The Mac map maps 152 source definitions; checkHooker is the sole order inversion, currently after hookMissileLaunched rather than before getCompilerErrors. Restoring that order loses the exact uninitialized-move copy for SLuaEntityActionButton and lowers several other scores. Companion-first and CLuaFileValues-first include overlays preserve all scores without gains. All 31 declaration-count phases have zero locked functions and zero witnesses. statics reports all seven objects same-layout across 72 aligned references; .bss is exact at 0x86b8e0 (52 bytes) and .rodata is exact at 0x5f5ae0 (1056 bytes), including the 992-byte Lua registration table at offset 0x40. place-bss learns zero placements and place verifies zero new called sections. The unit emits 48 inline/template copies, 47 placed, with one surplus SLuaEntityActionButton copy constructor. The verified canonical IPA inline dump grows from 28,021 to 36,437 estimated instructions with 1520 calls inlined, reaching the 30 percent unit-growth allowance. This is candidate compiler history, not an original compiler trace." },
  { commit = "2fd01e8", function = "CLuaManager::addModsFromFiles", note = "The target is 5330 bytes and the source emits 5442, at Concord instruction score 76.56 and objdiff 79.458084. Its literal identities, configuration calls, flag stores, file-existence checks and push_back operation agree with the target. Target offsets +0xce5 and +0xd09 call CString<char>::operator= inside the inlined SLuaMod copy on push_back's free-capacity path; ours inlines those two assignments and calls new[] instead. The extra stack-zero constant is the spilled file-loop index, rather than another source initialization. The Mac-order overlay raises objdiff to 84.57409 but loses an exact template and lowers other functions, so it is rejected. += is unchanged at 79.458084; direct folder-pointer assignment falls to 77.33955 and loses SLuaFilePair's copy and the exact substring helper. Neither body form is installed or reaches an oracle keep." },
  { function = "CLuaManager::hookWaveButton", note = "The target at 0x444530 is 124 bytes: it sign-extends the int button with movslq, then computes button + 1 with a 64-bit lea before lua_pushinteger. The 123-byte source adds in int first. Authored (lua_Integer)button + 1 widens before adding one and makes the function exact, objdiff 93.59375 to 100. An exact match supplies the behavioral proof; no inexact oracle keep is involved. The whole-build gate against 2fd01e8 exits zero: 1 functions changed: 1 newly matched, 0 worse; data bytes matched: +0 -0. No configuration file changes." },
  { function = "Save-table and creative-hook residuals", note = "addLuaTableVars has three target CString<char>::operator= calls where the candidate inlines them (3150 versus 3358 bytes). getLuaTableVars has two such target calls in inlined subString return copies plus a destructor/unwind cleanup difference (2345 versus 2406). The unit's standalone substring copy remains exact. checkCreativeHooker inlines pointer-string assignment in the target but calls it out of line in the candidate (440 versus 387); pushCreativeHooker is 966 versus 1031. In each hook function, direct CreativeHooks[hookSet] access and implicit name conversion leave every score unchanged. The vector<SLuaFilePair> insertion copy emits 1327 against 2662 bytes, while CCreativeEntity's copy is exact at the same target address; this local gap is not a new unmatched whole-build extent." },
  { function = "Remaining instruction and block constraints", note = "A direct-continue rewrite of harvest_findBuildings lowers objdiff from 60.5539 to 43.449814 and loses three exact copies despite making includeMod exact; it is rejected. harvest_isPositionBlocked's int local lowers 86.84615 to 83.76923 and an XOR at the Lua argument lowers it to 84.84615; both are rejected. Its target preserves two boolean inversions that the current compile folds. includeMod, refreshAvailableLuaMods, extractLuaPath, harvest_getSelectedBuildings, SLuaMod's copy and the SCreativeHook/CString uninitialized-move helpers retain register-choice differences already classified in the earlier scratch-history audit. harvest_getSelectedBuilding retains one reversed comparison. No shared header correction is established by these inexact caller sites." },
  { function = "Effective compiler inputs", note = "Pinned g++ (Ubuntu 4.4.3-4ubuntu5) 4.4.3, -O2, -Isrc, -Isrc/HarvestFull, -Ithird_party/luajit-2.0.0-beta8/include. Container image SHA-256 b94ef6033199879fb811edc1d642923532b9213f245eb081646157559e3d45dd. Baseline CLuaManager.cpp SHA-256 5639b4fae3dfbed4eb41aef1b83a504931c893d98c323d622d80527d934dfe80; CLuaManager.h 72ec7cafd271efa7f9794fe704899c0d6c90331882bb917ce1840f5cff31bb78; CString.h 7cc2521534a1b7864708fdc416a25279f05507d6c045abeca04545f4a88b95ee; flags.json 9ebb8c16c904108ddb5cbaa50345a733d400ee2bd3994c72e5545e676fb03ad8; units.toml 3778e24f111650836f8595ff618bd1661fc73ff02178f0c91e1a34d123a81f32; symbols.tsv 3b156c561057e2eac32112e9abbb0b842174d530df82b1ae1bd37091eaa5c21d. The causal diagnostic code is byte-verified against the canonical compile, code SHA-256 1b1066654937ed159e7f3840b81e9b226c954508cb07a04d94a15bd68b4edb38. The IPA inline dump SHA-256 is 3ad2678b58dffbe2a1da86248c037c2770472c5fb12d55cf52fa38940a808e29." },
  { function = "Accepted correction validation", note = "The accepted correction retains only the authored hookWaveButton line; final source SHA-256 3bef655a58d9047b1b6b5fc97e67030d7c21da0a25108c0ae29c65905a10d914. The final unit matcher reports 182/204 exact and exits 1 for its remaining differences. Both port builds, harvest and census with -j2, pass. The Harvest toolchain suite passes 232 tests with 3 skips, and concord passes 520 unittests with 22 skips and clean Ruff. Both diffs pass whitespace checks. The vtable census compares 350 tables and reports only the existing CVideoSoftware slot-11 mismatch, unrelated to this unit. The struct-layout census attributes no finding to CLuaManager.cpp. No header, placement, symbol or compiler-option change is retained." },
