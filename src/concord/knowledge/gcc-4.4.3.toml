[[idiom]]
id = "peephole2-unit-scratch-state"
cause = "register-allocation"
status = "confirmed"
symptom = "unchanged functions acquire different scratch loads or epilogue pops after other bodies are restored"
fix = "Trace the differing instruction before moving locals. GCC 4.4.3 peep2_find_free_register keeps a static search_ofs across functions; a successful search advances to the next allocation-order index, while a failed search resets it to zero. Register classes, mode and liveness filter that search, so counting successful calls modulo the hard-register count alone does not predict its state. Measure unit context rather than rewriting an exact shared header."
limits = "At Harvest 63bf9dc, both remaining reader blockers first introduce their differing instructions in peephole2 (pass 182). getNextTokenAsString has unchanged body text: its inlined CString copy-loop used-field load selects r9 instead of target r12. TArray<SXAnimationSet> D1 selects rbp instead of target rdi for an eight-byte stack adjustment. Neither function has an expand partition or an aligned frame-slot constraint. Each of the two bounded placement interventions measures 70 sibling positions, moving the token-reader definition and then its owning reader destructor, with no improvement over the restored parser order. The normalized gate against 63bf9dc still reports 28 newly matched, 2 worse and matched data +1960/-0 bytes. Both stop without retained source changes; the seven parser stubs remain. A scratch-state padding census is untested and lies beyond these two interventions."
evidence = [
  { commit = "63bf9dc", function = "daisy::scene::CXFileReader::getNextTokenAsString and ox::TArray<SXAnimationSet>::~TArray", note = "Fresh canonical and diagnostic objects agree for both functions. Real dump fixtures preserve the csa and peephole2 function sections and their source hashes; tests identify peephole2 introduction rather than IRA allocation. The source constructs are CString.h's used-count copy loop and TArray.h's destructor epilogue. Both placement searches retain current as their best candidate against unchanged reference source." },
  { function = "GCC 4.4.3 peep2_find_free_register", note = "Primary source: https://github.com/gcc-mirror/gcc/blob/releases/gcc-4.4.3/gcc/recog.c#L2930-L3027 . search_ofs is local static state. Success stores the next raw register index, using reg_alloc_order where configured. Failure sets search_ofs to zero. There is no per-function reset of this local static variable." },
]


