  { function = "seven functions whose only differences are operator=(const B*) copy loops at CString.h:159", note = "Measured negative at b0464ee, mechanism corrected at 048e50d on CBase64url::encode2's -fdump-tree-all dumps: every inlined copy carries `len >= l` with the lower SSA version on len through 059t.mergephi2. The exit PHI that rewrite_into_loop_closed_ssa creates in 060t.vrp1 for the post-loop len (`while (*p) ++len;`) takes a recycled SSA version from FREE_SSANAMES rather than a fresh one (the unit's highest version stays 913), so len ends up with the higher version, and tree_swap_operands_p in 066t.ch and 113t.dom2 swaps the test to `l <= len` per copy. Not a value-numbering or call-site decision. String literal calls sit in both groups: the .0 call flips and the . call matches (millisecondsToWide lines 39 and 41), and identical Base64Alphabet2[...] calls match in the while loop but flip at the first call of each switch case (encode2 lines 87 and 93). About fifty caller-side variants across five units (named const pointer, named CString temporary, cast, implicit conversion, swapped branches, statement and definition order, dead and live padding, init-list members, chained stores, loop forms) and 128 permute candidates left every site's operand order in place. phase shows no declaration lock." },
  { function = "the same sites routed through CString<T>::operator+(const B*) or an append(const B*) member", note = "Measured negative at b0464ee on the different-inline-chain lead. The Mac map's CString<char>::operator+<char>(const B*), emitted only in COSXOperator.mm, is already in the header (upstream 858c93e); no other non-Mac member is missing. Every routing through a genuinely different chain collapses the match instead of flipping the compare: result + lit scores 25-80 of 99.82, a temp built by CString<T>() + lit scores 46-83, a ctor delegating to *this + c scores 37-66, a new append(const B*) member used as result.append(lit) scores 24-85, and Score = columns[2].c_str() without the temporary scores 68 of 99.70. A ctor carrying its own copy loop instead of *this = c compiles byte-identically in both entity constructors (GCC folds the delegation) and is worse elsewhere. Spellings that fold back to the same chain (result.append(L\"0\"), Response == \"Error\", addNewAnimationState(\"SparkMover\")) compile byte-identically with the flip in place. The original's flipping sites do go through operator=(const B*); the operand order is not a chain artifact." },
