# Codegen idiosyncrasies of g++ (Ubuntu 4.4.3-4ubuntu5) 4.4.3 at -O2, x86-64.
#
# Each idiom pairs a symptom concord's diff reports (its cause) with a source
# change that moves GCC's output toward the target. "confirmed" idioms were
# applied in a commit that made a function or unit match; "hypothesis" idioms
# are observed but not yet isolated. Evidence names commits in
# github.com/banteg/harvest.

compiler = "g++ (Ubuntu 4.4.3-4ubuntu5) 4.4.3"
flags = ["-O2"]

[[idiom]]
id = "dropship-logic-lifetimes"
cause = "block-order"
status = "hypothesis"
symptom = "CDropshipEntity::updateLogic has matching call and constant multisets but differs in a landing condition, approach-state tail sharing, gun evaluation order and missile coordinate lifetimes."
fix = "Reduce landing pitch inside the altitude-below-15 branch. Retain the approach alignment result, evaluate the gun sine before constructing its start vector and declare each missile's Y coordinate before X. Measure these authored forms through author, the oracle and the whole-build gate."
limits = "The remaining state and cooldown block placement is unresolved. The cooldown branch correction and the completed 128-candidate permutation search are the two failed interventions; stop body trials until a new source hypothesis has evidence. A closer instruction alignment or equal code size does not establish an exact function or correct behavior. Preserve the measured includes, class declarations, static data and loadSprite body; its CString inline distribution has a separate recorded blocker."
