[[idiom]]
id = "branch-sense"
cause = "block-order"
status = "confirmed"
limits = "Applied only where the diff reports block order, concord's branch-sense transform (`if (c) A else B` to `if (!c) B else A`) improved 17 of 98 Harvest functions with a block-order finding and made none exact on its own; applied anywhere by concord permute, it made two exact whose diffs named other causes (see evidence). CGUIWindow::draw went from 89.18 to 99.73, leaving one loop-entry compare (cmp [rsp+0x98], r12d in the target, the reverse in ours) that four rewrites of its loop did not flip: hoisting the bound before or after the step (worse, 98.36), declaring x before the step (99.59), and a while loop (identical bytes); CBuildableItems::loadCreativeBuildingData went from 91.79 to 99.14 and CPlayState::addParticleEntity from 86.59 to 97.56. Mixing up to 32 one-definition moves per round into a 6-round search on those 17 functions, at harvest 4bc99eb, left every one where branch sense alone had left it."
symptom = "the then and else blocks of an if sit in the opposite order, with the conditional jump inverted (je against jne)"
fix = "Negate the condition and swap the branches. GCC 4.4 tends to lay the then-branch out as the fall-through, so `if (!x) A else B` places A where `if (x) B else A` places B."
before = "if (mutate) { /* mutate */ } else { /* copy */ }"
after = "if (!copyMine) { /* mutate */ } else { /* copy */ }"
evidence = [
  { commit = "9edc1d4", function = "harvest::entity::CShuttleEntity::resetAllAiByMe", note = "combined with other changes in the same commit" },
  { function = "daisy::gui::CGUIEditBox::draw", note = "concord permute at harvest d2d0bfb swaps the Animations[EEBA_BACKGROUND] branches at line 572; 32 compiled candidates make the 5,623-byte target exact, with no whole-build regression, although diff reported only alignment or relocation differences" },
  { function = "daisy::gui::CGUIListBox::draw", note = "concord permute at harvest 4bc99eb: `if (!DrawBack) { children } else IGUIElement::draw();` as `if (DrawBack) IGUIElement::draw(); else { children }` made it exact (98.45); the diff had attributed its mismatch to other causes, so only a search over every transform tried it" },
  { function = "harvest::settings::CSystemConfig constructors", note = "concord permute at harvest 4bc99eb: setting the default resolution in the then-branch, `if (attributeExists(h) != true || !attributeExists(v)) setScreenRes(resolution); else { ... }`, made C1 and C2 exact (98.14)" },
]

[[idiom]]
id = "inline-in-header"
cause = "inlining"
status = "confirmed"
symptom = "a call on one side where the other side has the callee's body inline, or the reverse"
fix = "Define the callee where the original did: inline in the class definition or an included header lets GCC inline it at -O2, an out-of-line definition in another unit prevents it. Match the original header layout (the Mac debug map's N_SOL header markers show which headers contributed code)."
evidence = [
  { commit = "0003aa9", function = "ox::gui::IGUIElement and IGUILayout", note = "inline method bodies added to IGUILayout.h, as in the original headers" },
]

[[idiom]]
id = "named-temporary"
cause = "register-allocation"
status = "hypothesis"
symptom = "a repeated subexpression is recomputed on one side and kept in a register on the other, with spills or copies around it"
fix = "Introduce or remove a named local for the repeated subexpression. GCC 4.4's common-subexpression elimination does not always merge repeated array indices or member loads, so a local changes what stays in a register."
before = "MiddleTargets[NextCheckPoint % 14].X = ...; EndTargets[NextCheckPoint % 14] = ...;"
after = "int next = NextCheckPoint % 14; MiddleTargets[next].X = ...; EndTargets[next] = ...;"
evidence = [
  { commit = "9edc1d4", function = "harvest::entity::CShuttleEntity::updateLogic", note = "not isolated from the other changes in the commit" },
]

[[idiom]]
id = "thunk-without-unwind-entry"
cause = "placement"
status = "confirmed"
symptom = "a this-adjusting thunk (_ZThn..., _ZTv...) whose bytes match but which the matcher cannot place at an unwind entry"
fix = "No source change: GCC 4.4 emits no unwind-table entry for thunks, in the original or in a recompile. Harvest's matcher proves a function's extent by its unwind entry, by design, so thunks stay inexact there even when their bytes match. Their extent is provable another way: the thunk ends at its jmp, and a slot in its class's vtable points at it."
evidence = [
  { function = "about 230 thunks across Harvest units", note = "bytes identical to the target; no FDE on either side" },
]

[[idiom]]
id = "inliner-pass-operand-order"
cause = "operand-order"
status = "hypothesis"
symptom = "swapped compare operands inside an inlined callee's code, where other functions that inline the same callee match"
fix = "Trace the inlined loop's single static assignment (SSA) names through value-range propagation (vrp1) and loop-header copying (ch). Recycling can reverse a comparison in one copy while another call with the same argument matches. A source correction remains unidentified; accept a caller change only when it matches or improves under the oracle and preserves the other scores."
limits = "`concord survey --lines` puts 84 operand-order findings in 30 functions on one line, CString.h:159 (the copy loop of operator=(const B*)), and 41 more on CString.h:186-187 (operator<). Rewriting those lines in the header, judged by exact functions over all 110 units that include it, never gained: `l <= len` and swapped spellings compile to the same bytes, `l < used` lost 333 exact functions for 3, an unsigned counter lost 308 for 9, and Irrlicht's original append (len = other.size() + 1) lost 84 for 6. Caller-side no-ops in CMineralGatherEntity's constructor (a dummy local, braces, an implicit conversion, a const char* local) left its swapped compare in place, and naming the temporary or reordering statements made it worse. The header as written is the best uniform form, so inspect the caller's compiler state before changing it."
