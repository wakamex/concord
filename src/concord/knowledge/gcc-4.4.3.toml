fix = "Keep the current source until a measured correction reproduces the target call distribution across the dependent GUI units. Require a source candidate to improve the affected functions and pass the whole-build score gate without losing matched data."
limits = "At Harvest a3b9f79, calls-constants compares 53 functions and finds 33 with differences. CGUITextButton::CGUITextButton is 2,037 target bytes at 80.41%; CGUITabControl::CGUITabControl is 1,177 bytes at 83.75%; CGUIRadioList::CGUIRadioList is 1,065 bytes at 79.19%; CGUIContextMenu::CGUIContextMenu is 854 bytes at 81.70%; CGUIContextMenu::~CGUIContextMenu is 826 bytes at 67.95%; and the deleting CGUIButton::~CGUIButton is 681 bytes at 72.96%. The first three candidates call IGUIElement::~IGUIElement out of line where the target has inline cleanup calls to IEventReceiver::~IEventReceiver, delete[] and delete; the context-menu constructor has the reverse out-of-line base-destructor pairing. The context-menu and button destructors also replace target cleanup calls with an out-of-line IGUIElement destructor, and the context-menu destructor has a candidate _Unwind_Resume where the target has event-receiver and deallocation calls. These call rows are classified as inline-distribution differences. Irrlicht 0.7 ancestors exist for the tab-control and context-menu constructors and the context-menu destructor; their method bodies do not provide a source correction. No ancestor exists for the text-button or radio-list constructor. The button destructor ancestor uses different sprite members and does not supply the current method's corrected form. The current IGUIElement destructor includes Children.clear() and HoverItem cleanup, which the old ancestor lacks, and both operations appear in the target disassembly. Two IGUIElementInline.h author overlays were measured across 40 dependent units: removing Children.clear() and moving the IGUIElement constructor before the destructor. Both were rejected with zero gains and no errors; neither was applied. Neither inexact candidate received an oracle check. The unchanged-source whole-build gate exits 0 and reports: 0 functions changed: 0 newly matched, 0 worse; data bytes matched: +0 -0. No source correction for these call differences is established; stop after these two no-gain interventions until new evidence identifies a form that improves the call distribution."
evidence = [
  { function = "Six residual functions", note = "concord calls-constants at Harvest a3b9f79 reports candidate out-of-line IGUIElement::~IGUIElement calls replacing target inline cleanup calls in CGUITextButton::CGUITextButton, CGUITabControl::CGUITabControl, CGUIRadioList::CGUIRadioList, CGUIContextMenu::~CGUIContextMenu and the 681-byte deleting CGUIButton::~CGUIButton. The target cleanup includes IEventReceiver::~IEventReceiver, operator delete[] and operator delete calls; CGUITabControl and CGUIRadioList also differ at _Unwind_Resume. CGUIContextMenu::CGUIContextMenu has the opposite base-destructor pairing: candidate calls IEventReceiver::~IEventReceiver and target calls IGUIElement::~IGUIElement. Residual scores are 80.41, 83.75, 79.19, 81.70, 67.95 and 72.96 respectively; no candidate score changed." },
  { function = "Irrlicht 0.7 ancestors", note = "CGUITabControl's constructor and CGUIContextMenu's constructor and destructor have Irrlicht 0.7 ancestors; their relevant method bodies already match the recovered source form after current project adaptations. CGUITextButton and CGUIRadioList have no matching ancestor methods. CGUIButton's ancestor destructor uses Image and PressedImage instead of the current sprite members. None supplies a corrected method body for the measured call differences." },
  { function = "Shared header overlays", note = "concord author evaluates each IGUIElementInline.h overlay across 40 dependent units. Removing Children.clear() and moving the IGUIElement constructor definition before its destructor are each rejected with accepted false, zero gains, no errors and no application. The target IGUIElement destructor disassembly includes Children.clear() and HoverItem cleanup, so restoring the full old ancestor body would remove target behavior. No oracle check is run for either rejected inexact candidate." },
  { function = "Baseline whole-build gate", note = "With Harvest source and configuration unchanged at a3b9f79, concord scores --harvest /code/harvest-swe2c --base a3b9f79 exits 0 and reports: 0 functions changed: 0 newly matched, 0 worse; data bytes matched: +0 -0. No configuration changes are reported." },
]

