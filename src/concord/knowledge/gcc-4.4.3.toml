  { commit = "15d71bd", function = "CPlayState::renderRangeCircle", note = "The target doubles i with addss and multiplies by -0.04833219572901726, the float at 0x60b068. Restoring that sign placement alone lowers objdiff from 75.25742 to 73.435646. Computing Y before X raises the combined form to 79.88119; explicit screenPosition fields reach 89.15842; constructing Beam258.End as one position pair reaches 95.44554 and the target's 432-byte size from 436. Each screen retains all other unit scores. The remaining three aligned rows reorder two constant loads and the saved double range at target +0xc1, +0xcc and +0xd4. Four alternate declaration and initialization forms leave the score unchanged. The first selected candidate is rejected because the default 60-second oracle times out; an unchanged-source control also times out at 60 seconds, so that failure supplies no behavior verdict. One bounded 180-second author retry succeeds: source forms differ in 1,314 of 5,000 cases, zero undefined; differences against the original fall from 1,314 to zero. The accepted source uses named screen coordinates, positive doubling with the target's negative angular increment and one endpoint constructor. No oracle cases or comparisons are removed for the retry." },
