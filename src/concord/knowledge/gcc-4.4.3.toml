[[idiom]]
id = "translated-string-reference"
cause = "reference"
status = "confirmed"
symptom = "a near-exact ancestor function refers to a merged string that the target does not contain"
fix = "Preserve string literal tokens during translation. For an existing translated unit, restore corresponding ancestor literals only when compiling them makes the complete function exact and preserves the other functions. Place any separately unplaced called template sections before verifying the repair."
