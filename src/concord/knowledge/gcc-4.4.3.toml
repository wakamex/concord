[[idiom]]
id = "thunk-without-unwind-entry"
cause = "placement"
status = "confirmed"
symptom = "a this-adjusting thunk (_ZThn..., _ZTv...) whose bytes match but which the matcher cannot place at an unwind entry"
fix = "No source change: GCC 4.4 emits no unwind-table entry for thunks, in the original or in a recompile. Harvest's matcher proves a function's extent by its unwind entry, by design, so thunks stay inexact there even when their bytes match. Their extent is provable another way: the thunk ends at its jmp, and a slot in its class's vtable points at it."
evidence = [
  { function = "about 230 thunks across Harvest units", note = "bytes identical to the target; no FDE on either side" },
]

[[idiom]]
id = "inliner-pass-operand-order"
cause = "operand-order"
status = "hypothesis"
symptom = "swapped compare operands inside an inlined callee's code, where other functions that inline the same callee match"
fix = "Leave the callee's source alone: the operand order appears to depend on which GCC 4.4 inliner pass inlined that copy. Change how the caller reaches it instead, such as which call comes first or whether a temporary is constructed separately, so that copy is inlined the way the original's was."
limits = "`concord survey --lines` puts 84 operand-order findings in 30 functions on one line, CString.h:159 (the copy loop of operator=(const B*)), and 41 more on CString.h:186-187 (operator<). Rewriting those lines in the header, judged by exact functions over all 110 units that include it, never gained: `l <= len` and swapped spellings compile to the same bytes, `l < used` lost 333 exact functions for 3, an unsigned counter lost 308 for 9, and Irrlicht's original append (len = other.size() + 1) lost 84 for 6. Caller-side no-ops in CMineralGatherEntity's constructor (a dummy local, braces, an implicit conversion, a const char* local) left its swapped compare in place, and naming the temporary or reordering statements made it worse. The header as written is the best uniform form, so the differing copies follow the unit's inlining context."
evidence = [
  { function = "harvest::entity::CSparkMoverEntity and CMineralGatherEntity constructors", note = "only the first inlined CString copy loop has cmp len, i; single-string constructors match (harvest docs/matching.md)" },
  { function = "seven functions whose only differences are operator=(const B*) copy loops at CString.h:159", note = "Measured negative at b0464ee, mechanism corrected at 048e50d on CBase64url::encode2's -fdump-tree-all dumps: every inlined copy carries `len >= l` with the lower SSA version on len through 059t.mergephi2. The exit PHI that rewrite_into_loop_closed_ssa creates in 060t.vrp1 for the post-loop len (`while (*p) ++len;`) takes a recycled SSA version from FREE_SSANAMES rather than a fresh one (the unit's highest version stays 913), so len ends up with the higher version, and tree_swap_operands_p in 066t.ch and 113t.dom2 swaps the test to `l <= len` per copy. Not a value-numbering or call-site decision. String literals sit in both groups: the same literal call matches at one site and flips at another (millisecondsToWide lines 39 and 41), and identical Base64Alphabet2[...] calls match in the while loop but flip at the first call of each switch case (encode2 lines 87 and 93). About fifty caller-side variants across five units (named const pointer, named CString temporary, cast, implicit conversion, swapped branches, statement and definition order, dead and live padding, init-list members, chained stores, loop forms) and 128 permute candidates left every site's operand order in place. phase shows no declaration lock." },
  { function = "the same sites routed through CString<T>::operator+(const B*) or an append(const B*) member", note = "Measured negative at b0464ee on the different-inline-chain lead. The Mac map's CString<char>::operator+<char>(const B*), emitted only in COSXOperator.mm, is already in the header (upstream 858c93e); no other non-Mac member is missing. Every routing through a genuinely different chain collapses the match instead of flipping the compare: result + lit scores 25-80 of 99.82, a temp built by CString<T>() + lit scores 46-83, a ctor delegating to *this + c scores 37-66, a new append(const B*) member used as result.append(lit) scores 24-85, and Score = columns[2].c_str() without the temporary scores 68 of 99.70. A ctor carrying its own copy loop instead of *this = c compiles byte-identically in both entity constructors (GCC folds the delegation) and is worse elsewhere. Spellings that fold back to the same chain (result.append(L\"0\"), Response == \"Error\", addNewAnimationState(\"SparkMover\")) compile byte-identically with the flip in place. The original's flipping sites do go through operator=(const B*); the operand order is not a chain artifact." },
]

[[idiom]]
id = "ipa-inliner-distribution"
cause = "inlining"
status = "hypothesis"
symptom = "functions in a unit differ only in how many copies of a shared inline callee (CString<char>::CString(const char*), ~CString) the IPA inliner placed in each; total call sites agree with the target"
fix = "The deciding pass is pass_ipa_inline (042i.inline dump), which greedily inlines edges by badness until the unit growth passes inline-unit-growth (30%) of the starting insn count. Equal-badness edges are decided by fibheap order, which follows the order callers are walked: cgraph_nodes is a LIFO list, so callers are visited in reverse cgraph uid order, which is reverse DEFINITION order in the unit for the unit's own functions (nodes are created at definition, not at declaration). Only a definition-order change moves the distribution."
limits = "Verified on CAlienEntity.cpp at harvest 048e50d (unit starts at 22513 insns and ends at 29299, exactly the 30% cap): include order (own header first), free declarations and unused static inline helpers before the unit, member declaration order and added member declarations in the class header all compile byte-identical. The unit's replaceWith* definition order matches the Mac map, and moving replaceWithTinySprites before replaceWithMegaSprites shifted copies (Magneto 14005->11717, Looker 7045->8917, Tiny 4549->5557, all still inexact; targets 12437/8485/4741), moving JammerSprite or SummonerSprites late improved Looker to 76.46 at size 7029, while moving Magneto earlier changed nothing. Raising the cap param (growth=31..35) only grows the tail callers (Tiny, then Looker), never shrinks Magneto, so the original's cap did not simply sit elsewhere: the residual difference is in the unit's body content (inexact neighbors feed the initial count and edge frequencies), not in its declaration context. Do not reorder the unit to force the distribution; the map already shows the original order."
evidence = [
  { function = "harvest::entity::CAlienEntity replaceWith{Magneto,Looker,Tiny}Sprites", note = "ours 14005/7045/4549 bytes against targets 12437/8485/4741; the 042i.inline dump shows 57 CString-ctor copies popped for Magneto first; same 227 call sites on both sides" },
  { function = "harvest::entity::CDefenseTowerEntity C1/C2 and harvest::states::CPlayState::OnEvent", note = "same cause family per the second reader: C2 target 24437 vs 24325, C1 15365 vs 15573, OnEvent 13607 vs 13263, equal call counts on both sides" },
  { function = "daisy::scene::CTerrainSceneNode destructors", note = "The sort calls' new edges flipped which equal-badness clone got the one affordable ~ISceneNode inline; defining the destructor after createIndexBuffers instead of after the constructor puts it back on D0. hv search verified 80 exact, no losses." },
]

