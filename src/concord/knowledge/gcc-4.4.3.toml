[[idiom]]
id = "commutative-operand-order"
cause = "operand-order"
status = "hypothesis"
symptom = "the two values of a commutative operation sit in the other registers, or a consuming instruction takes its operands in the other order"
fix = "Write a commutative operation with its operands in the other order: `x * x + y * y` as `y * y + x * x`. GCC 4.4 creates the operands' values in source order, so the spelling sets SSA numbering and with it register choices, even though the computed value is the same."
limits = "Operands with side effects are left alone, since C++ does not fix their evaluation order and swapping the text could swap the effects. An overloaded operator resolves on its left operand, so a swap can call a different function or fail to compile; the compile and oracle checks reject those. The benchmark's commutative mutation had no inverse rewrite before this one."
evidence = [
  { function = "harvest::entity::CAlienEntity::locateTargetBuilding", note = "candidate for the xmm0/xmm1 swap behind its distance sums at harvest c5d2e4c; unconfirmed until a search makes a function exact with it" },
]

[[idiom]]
id = "split-declaration"
cause = "register-allocation"
status = "hypothesis"
symptom = "a short-lived value sits in the neighbouring register, with every instruction otherwise the same"
fix = "Split a built-in local's declaration from its initializer (`float x = e;` as `float x; x = e;`), or join the two back into one declaration. GCC 4.4 numbers the declaration and the assignment separately, which moves the order it creates later values in."
limits = "Only non-const locals of built-in types split safely: splitting a class local would default-construct it and then assign, which changes what the code does. The benchmark's split mutation had no inverse rewrite before this pair."
evidence = [
  { function = "harvest::entity::CAlienEntity::locateTargetBuilding", note = "candidate for the xmm1 against xmm0 choice on its bestDistance constant at harvest c5d2e4c; unconfirmed until a search makes a function exact with it" },
]

[[idiom]]
id = "definition-order"
cause = "register-allocation"
status = "confirmed"
symptom = "registers or inlining decisions differ in a function whose own source is right"
limits = "Search depth matters: after 128 orders and 2 restarts per unit found nine functions (banteg/harvest#19), 512 orders, 4 restarts and another seed found seven more in five other units (banteg/harvest#21), each a single moved definition. A further sweep with 2,048 orders, 8 restarts and seed 2 over all 81 multi-definition units found none, so order alone is exhausted on Harvest at these budgets. Definition order alone closes few register differences. hv search with 128 orders and 2 restarts on the 12 Harvest units with the most functions whose main difference is register allocation (148 such functions) gained one exact function. Of the 258 such functions overall, 123 are header code (59 inline IGUIElement or IGUILayout copies, 55 libstdc++ and 9 project template instances), whose registers depend on the unit around them rather than on their own source."
fix = "Move function definitions within the translation unit. GCC 4.4 processes a unit's functions in definition order, so the order changes which callees are inlined and how registers are allocated. `hv search` searches definition orders automatically."
before = "bool CConfiguration::blockExists(const wchar_t*) defined before CConfigBlock* CConfiguration::getBlock(const wchar_t*)"
after = "getBlock(const wchar_t*) defined first"
evidence = [
  { commit = "7ece3d7", function = "ox::game::CConfiguration::getBlock(const wchar_t*)" },
  { commit = "3708bf8", function = "harvest::game::CWorld", note = "unit definitions reordered to the build's order" },
  { commit = "e4b0712", function = "harvest::gui::CMainMenuScreen", note = "restored definition order" },
  { function = "std::__final_insertion_sort for CVideoNull::SSurface", note = "hv search at 69ea9eb: defining CVideoNull::setInputTexture earlier made this libstdc++ instance exact, so order also steers template code whose source is fixed" },
  { function = "daisy::scene::CParticleSystemSceneNode::reallocateBuffers", note = "At target address 0x56d4b0, the 470-byte function matches when defined before doParticleSystem and its two Irrlicht set_used calls become reserve. The target calls vector::reserve at 0x5701e0 and 0x570760 and never changes the buffers' logical sizes. Seeding learns the previously unnamed function and the vertex reserve callee, giving 59/60 exact functions in the unit." },
  { function = "daisy::scene::CMeshSceneNode destructor variants", note = "Defining the destructor before the constructor restores the target's destructor exception-table order. Four differing bytes otherwise reject the entire 173-byte .gcc_except_table section at 0x6636d2 even when all three destructor bodies match." },
  { function = "daisy::io::CZipReader sort helpers", note = "The unit has 30 functions, 24 exact and six inexact: scanLocalHeader, four SZipFileEntry std::sort helpers and vector::insert_aux. phase reports 24/30 exact, 0 locked and 0 witnesses. scratch-history records 101 actual scratch searches and 0 failed resets; selected events in both helpers come from CString assignment at CString.h:119, and the event before introsort_loop is in CZipReader::scanLocalHeader. This is the candidate compiler trace, not a target history. The method order differs from the bundled ancestor after the constructor: the current source puts scanLocalHeader before the destructor and extractFilename. concord sweep with 128 orders, 2 restarts and seed 0 plateaued with 0 exact gains. No source or order candidate was retained, so no oracle or normalized score gate ran; there is no gate summary line." },
]

[[idiom]]
id = "result-flag-or-early-return"
cause = "block-order"
status = "confirmed"
symptom = "the blocks of a switch's cases, or its lowering, differ: a compare chain against a lookup table, or case bodies laid out in another order"
fix = "Try the other exit style. A switch whose cases `return true` lays out differently from one whose cases set `result = true; break;` and return once at the end, and a result flag can let GCC turn a switch into a lookup table where early returns keep a compare chain."
before = "case ID_BACK: removeWindow(); return true;"
after = "case ID_BACK: removeWindow(); result = true; break;"
evidence = [
