[[idiom]]
id = "companion-header-definition-order"
cause = "inlining"
status = "confirmed"
symptom = "Restoring an exact ancestor body rotates otherwise exact destructor exception records, losing matched data while adding exact functions."
fix = "Keep the companion header ahead of generated quoted includes, retaining preceding system includes. This preserves the ancestor's order of inline definitions instead of letting qualified type includes invert it. seed does this by default; refresh --companion-first applies it to an existing unit together with a selected body restoration."
limits = "The observed cause is translation-unit context. Include order is measured together with the restored body; reordering a stubbed unit alone need not preserve its output. Conditional companion includes are left untouched."
