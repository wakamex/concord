  { function = "Pooled literal sections", note = "The baseline and guarded candidate objects have identical 736-byte .rodata sections and identical 112-byte .rodata.str4.4 sections. Their mergeable string sections have the same sizes and literals but changed byte positions: .rodata.str1.1 is 712 bytes with 247 differing byte positions, .rodata.str1.8 is 325 bytes with 136, and .rodata.str4.8 is 3,644 bytes with 135. In .rodata.str1.1 the target places the loadHighscores query fragments before <br>, | and the parser button names; the candidate places the parser literals and summary query fragments first. In .rodata.str1.8 the target getHighScores URL begins at +0x70 and getSummaryPage at +0xa0; the candidate reverses them, placing getSummaryPage at +0x70 and getHighScores at +0xe0. In .rodata.str4.8 www.oxeyegames.com moves from +0x390 to +0x578; the four highscore info strings move from +0x3e0, +0x448, +0x4b0 and +0x520 to +0x390, +0x3f8, +0x460 and +0x4d0, and Credits and Last Update move from +0x578 and +0x598 to +0x528 and +0x548. The whole-build matched-data loss is therefore an offset and section-order effect, not a reduction in section size or literal content." },
  { function = "loadHighscores instruction differences", note = "The candidate reports 98.24909 versus the target's 100.00 and has 40 differing aligned rows. The first differences are +0x999 jne 0x640d versus jne 0x6405; +0xce0 mov ecx, [[.rodata.str4.8]+0x574] versus mov ebp, [.LC48-0x4]; +0xd05 test ecx, ecx versus test ebp, ebp; +0xd17 mov r15d, [rax] versus mov edi, [rax]; +0xd1a test r15d, r15d versus test edi, edi; and +0xd41 nop [rax] versus nop. The target rows +0xe9d lea r14, [rsp+0x60], +0xea2 mov esi, 0x0, +0xea7 mov qword ptr [rsp+0x60], 0x0, +0xeb0 mov dword ptr [rsp+0x68], 0x0, +0xeb8 mov dword ptr [rsp+0x6c], 0x0, +0xec0 mov rdi, r14 and +0xec3 call CString<char>::operator=(char const*) align with candidate rows +0xeb4 lea eax, [rbx+0x1], +0xeba mov [rsp+0x6c], eax, +0xebe mov [rsp+0x68], eax, +0xec7 mov [rsp+0x60], rax, +0xecc mov edx, 0x0, +0xed8 mov rax, [rsp+0x60] and +0xedd movzx edi, byte ptr [rdx]. The candidate-only sequence is +0xe95 mov qword ptr [rsp+0x60], 0x0; +0xe9e mov eax, 0x0; +0xea3 xor ebx, ebx; +0xea5 nop [rax]; +0xea8 add rax, 0x1; +0xeac add ebx, 0x1; +0xeaf cmp byte ptr [rax], 0x0; +0xeb2 jne short 0x6418; +0xeb7 movsxd rdi, eax; +0xec2 call _Znam-0x4; +0xed1 xor ecx, ecx; +0xed3 jmp short 0x644d; +0xed5 nop [rax]; +0xee0 mov rsi, rdx; +0xee3 add ecx, 0x1; +0xee6 sub rsi, 0x0; +0xeed add rdx, 0x1; +0xef1 cmp ecx, ebx; +0xef3 mov [rax+rsi], dil; and +0xef7 jle short 0x6448. At target +0xefc nop [rax] the candidate has +0xf2d nop [rax]. Candidate cleanup adds lea rdi, [rsp+0x60], mov r12, rax, lea rbx, [rsp+0xb0] and a CString destructor call at +0x1cc9 through +0x1cd9. The later jumps differ at target +0x1ca0 and +0x1ccd: jmp short 0x71b4 and jmp short 0x71c7; candidate +0x1cde and +0x1d0b: jmp short 0x71f7 and jmp 0x71f7. The unchanged source method's emitted CString assignment changes from an out-of-line call to an inline copy loop, adding 65 bytes; the string-section reorder also changes the host reference relocation." },
