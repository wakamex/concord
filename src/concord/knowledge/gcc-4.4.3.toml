# Codegen idiosyncrasies of g++ (Ubuntu 4.4.3-4ubuntu5) 4.4.3 at -O2, x86-64.
#
# Each idiom pairs a symptom concord's diff reports (its cause) with a source
# change that moves GCC's output toward the target. "confirmed" idioms were
# applied in a commit that made a function or unit match; "hypothesis" idioms
# are observed but not yet isolated. Evidence names commits in
# github.com/banteg/harvest.

compiler = "g++ (Ubuntu 4.4.3-4ubuntu5) 4.4.3"
flags = ["-O2"]

[[idiom]]
id = "cstring-inline-spelling-search"
cause = "operand-order"
status = "hypothesis"
symptom = "a caller differs only in comparisons attributed to CString assignment, equality or ordering, while emitted out-of-line copies of the same header operation can already match"
fix = "Measure the inline operation's value-creation spellings with causal-trial --header and the authored spelling families before changing the shared header. At Harvest 823b979 the bounded search retains the existing header: no measured form gains an exact copy without lowering another including-unit score. Swapping the assignment self-comparison also leaves the two attributed callers byte-identical. The source form that isolates the desired flips remains unresolved."
limits = "The search measures 52 authored forms, plus the existing comparison swap, across the four operators: loop bounds, while and do loops, source and destination pointers, shared indices, reversed conditions and character temporaries. Three gain-producing forms are measured separately in all 155 including units. Copy counts are per unit, rather than distinct target addresses. No combination or further spelling is inferred to be exhausted. One selected intervention per assignment operator and ordering is rejected; equality has no gaining form to select."
