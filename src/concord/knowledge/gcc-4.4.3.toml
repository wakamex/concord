[[idiom]]
id = "compare-operand-order"
cause = "operand-order"
status = "confirmed"
symptom = "a cmp with its operands swapped, with the conditional jump after it mirrored (jl against jg, jge against jle)"
fix = "Write an equality comparison with its operands in the other order: `a != b` as `b != a`. Relational comparisons do not respond to spelling: GCC 4.4 folds `y > x` to `x < y` and orders the operands of the cmp itself, by the order it created the values (SSA numbering), so `x < y` and `y > x` compile to the same bytes. Changing that order needs the values computed in another order, not the comparison respelled. A comparison whose value is returned rather than branched on does respond: respelling `return (array[i1] < other.array[i2]);` in CString::operator< as `>` with swapped operands cost 17 exact functions across Harvest."
before = "if (GraphType != type && ...)"
after = "if (type != GraphType && ...)"
limits = "Applies to comparisons of two non-constant operands written in the function itself. GCC moves a constant to the right of a comparison on its own, so `x > 0` and `0 < x` compile to the same bytes. Swapping an overloaded comparison, such as CString ==, calls the operator on the other object and changes much more than the cmp. Across the 88 Harvest functions whose main difference is operand order, swapping each comparison in the function's own source one at a time fixed none: 46 were inline copies defined in headers, 18 had no comparison in their own source, and in 24 no swap helped, so most of these compares come from inlined code."
evidence = [
  { commit = "4f54643", function = "harvest::gui::CStatisticsScreen::OnEvent" },
  { commit = "15eaefb", function = "ox::video::SMaterial::operator!=", note = "colorsDiffer(AmbientColor, other.AmbientColor) instead of colorsDiffer(other.AmbientColor, AmbientColor)" },
  { commit = "823b979", function = "daisy::io::CZipFileList::CZipFileList", note = "At 0x536b00 and 0x537c50, the 4,424-byte C2 and C1 each differ at +0x7a5: the target compares `folder` and `directory` characters as `cmp bl, dl`, while the candidate has `cmp dl, bl` in the filtered branch. The unit has 16/18 exact functions, with zero phase-locked functions or witnesses; scratch-history records 37 searches and zero failed resets. Reversing the overloaded CString equality through an explicit CString temporary lowers both constructors from 99.99029 to 91.66408, so author rejects the candidate and does not run the oracle. The unchanged checkout's score gate reports `0 functions changed: 0 newly matched, 0 worse; data bytes matched: +0 -0`. No correction is retained; a source form that reverses only this compare remains unidentified." },
  { function = "daisy::io::CFileSystem::intern_resolveAliases", note = "At 0x52e8c0, the 2,848-byte function differs only at +0x7ad: target `cmp al, cl`, candidate `cmp cl, al`, in the inline CString::operator< used by Aliases[alias]. Irrlicht 0.7's CFileSystem has no alias resolver, and the symbol and function placement match. The phase scan finds 48/59 exact functions, zero locked functions and witnesses, and this function is exact at no phase. Scratch-history records 40 searches and zero failed resets; the six searches in this function originate in CString assignment, not the operator< compare. Splitting the `start` initializer (`split-start-initializer`) and `end` initializer (`split-end-initializer`) separately leaves the score at 99.985794%, so author rejects both without running the oracle. The unchanged whole-build gate reports `0 functions changed: 0 newly matched, 0 worse; data bytes matched: +0 -0`. The mismatch is emitted within the shared inline comparator. The two caller declaration splits did not alter it, and no source or placement correction within the allowed CFileSystem files was found. Harvest 0d482f0, 0x52e8c0, 2837 bytes. +0x7ad: prephitmp.3888D.48554_202 (copyrename4); reused D.48184_202; D.48180_221 (ch); reused D.48094_221; constructs: src/daisy/io/CFileSystem.cpp:91, src/daisy/io/CFileSystem.cpp:81, src/daisy/io/CFileSystem.cpp:90. Final screen: 26 overlays; no retained correction; objdiff 99.985794 to 99.985794." },
  { commit = "823b979", function = "daisy::gui::CGUIButton::OnEvent", note = "At 0x5b4dc0, the 901-byte function has one reported flip: target `cmp r12d, dword ptr [rbx + 0xb8]; je`, candidate `cmp dword ptr [rbx + 0xb8], r12d; je`, attributed to the source equality `State != oldState`. `concord author` measured `oldState != State`; objdiff stayed 99.92453% before and after, and the baseline and candidate instruction bytes are identical. Author rejects the edit, so no oracle or whole-build score gate runs and no Harvest source is changed. The tested source equality swap leaves this comparison's emitted bytes unchanged in this unit. Harvest 0d482f0, 0x5b4dc0, 901 bytes. +0x20a: D.32976_127 (phiprop); oldStateD.32936_106 (phiprop); constructs: src/daisy/gui/CGUIButton.cpp:155, src/daisy/gui/CGUIButton.cpp:142. Final screen: 4 overlays; no retained correction; objdiff 99.92453 to 99.92453." },
  { commit = "823b979", function = "ox::core::CAes::expandKey", note = "At 0x5de6b0, the 417-byte function has one reported flip: target `cmp r12, r9; jne`, candidate `cmp r9, r12; jne`, attributed to line 142's relational loop condition `j < k + 4`. `concord author` measured `k + 4 > j`; objdiff stayed 99.90991% before and after, and the baseline and candidate instruction bytes are identical. The emitted `jne` follows an optimized relational loop and does not make the source condition an equality. Author rejects the edit, so no oracle or whole-build score gate runs and no Harvest source is changed. Harvest 0d482f0, 0x5de6b0, 417 bytes. +0xf4: ivtmp.1160D.25142_121 (copyrename4); reused ivtmp.1147D.25106_121; D.25132_320 (ivopts). Final screen: 26 overlays; no retained correction; objdiff 99.90991 to 99.90991." },
  { commit = "823b979", function = "harvest::game::harvest_getSelectedBuilding", note = "At 0x449080, the 146-byte function has one reported flip: target `cmp rbp, qword ptr [r12 + 8]; je`, candidate `cmp qword ptr [r12 + 8], rbp; je`, attributed to the source equality `it == buildings->end()`. `concord author` measured `buildings->end() == it`; objdiff stayed 99.652176% before and after, and the baseline and candidate instruction bytes are identical. Author rejects the edit, so no oracle or whole-build score gate runs and no Harvest source is changed. The tested source equality swap leaves this comparison's emitted bytes unchanged in this unit. Harvest 0d482f0, 0x449080, 146 bytes. +0x5c: D.71004_44 (phiprop); it$_M_currentD.71026_50 (phiprop); reused D.71018_50; constructs: /usr/include/c++/4.4/bits/stl_iterator.h:686, /usr/include/c++/4.4/bits/stl_iterator.h:708. Final screen: 7 overlays; no retained correction; objdiff 99.652176 to 99.652176." },
  { function = "daisy::io::CZipReader sort helpers", note = "At 0x53cac0, hv diff reports 99.90% and two differing rows: target `cmp al, cl; setg al`, candidate `cmp cl, al; setl al`. At 0x53df00, hv diff reports 99.75% and 16 differing rows, including the same inline comparison flip at +0x9c4 and register choices beginning at +0x153. The `SZipFileEntry::operator<` line in CZipReader.h matches the bundled ancestor in third_party/irrlicht-0.7/source/Irrlicht/CZipReader.h. A causal-trial using `other.simpleFileName > simpleFileName` fails to compile because CString has no `operator>`; there is no candidate score or oracle result. comparison-flips reports 41 functions and includes neither helper." },
]

[[idiom]]
id = "commutative-operand-order"
cause = "operand-order"
status = "hypothesis"
symptom = "the two values of a commutative operation sit in the other registers, or a consuming instruction takes its operands in the other order"
fix = "Write a commutative operation with its operands in the other order: `x * x + y * y` as `y * y + x * x`. GCC 4.4 creates the operands' values in source order, so the spelling sets SSA numbering and with it register choices, even though the computed value is the same."
limits = "Operands with side effects are left alone, since C++ does not fix their evaluation order and swapping the text could swap the effects. An overloaded operator resolves on its left operand, so a swap can call a different function or fail to compile; the compile and oracle checks reject those. The benchmark's commutative mutation had no inverse rewrite before this one."
evidence = [
  { function = "harvest::entity::CAlienEntity::locateTargetBuilding", note = "candidate for the xmm0/xmm1 swap behind its distance sums at harvest c5d2e4c; unconfirmed until a search makes a function exact with it" },
]

[[idiom]]
id = "split-declaration"
cause = "register-allocation"
status = "hypothesis"
symptom = "a short-lived value sits in the neighbouring register, with every instruction otherwise the same"
fix = "Split a built-in local's declaration from its initializer (`float x = e;` as `float x; x = e;`), or join the two back into one declaration. GCC 4.4 numbers the declaration and the assignment separately, which moves the order it creates later values in."
limits = "Only non-const locals of built-in types split safely: splitting a class local would default-construct it and then assign, which changes what the code does. The benchmark's split mutation had no inverse rewrite before this pair."
evidence = [
  { function = "harvest::entity::CAlienEntity::locateTargetBuilding", note = "candidate for the xmm1 against xmm0 choice on its bestDistance constant at harvest c5d2e4c; unconfirmed until a search makes a function exact with it" },
]

[[idiom]]
id = "definition-order"
cause = "register-allocation"
status = "confirmed"
symptom = "registers or inlining decisions differ in a function whose own source is right"
limits = "Search depth matters: after 128 orders and 2 restarts per unit found nine functions (banteg/harvest#19), 512 orders, 4 restarts and another seed found seven more in five other units (banteg/harvest#21), each a single moved definition. A further sweep with 2,048 orders, 8 restarts and seed 2 over all 81 multi-definition units found none, so order alone is exhausted on Harvest at these budgets. Definition order alone closes few register differences. hv search with 128 orders and 2 restarts on the 12 Harvest units with the most functions whose main difference is register allocation (148 such functions) gained one exact function. Of the 258 such functions overall, 123 are header code (59 inline IGUIElement or IGUILayout copies, 55 libstdc++ and 9 project template instances), whose registers depend on the unit around them rather than on their own source."
fix = "Move function definitions within the translation unit. GCC 4.4 processes a unit's functions in definition order, so the order changes which callees are inlined and how registers are allocated. `hv search` searches definition orders automatically."
before = "bool CConfiguration::blockExists(const wchar_t*) defined before CConfigBlock* CConfiguration::getBlock(const wchar_t*)"
after = "getBlock(const wchar_t*) defined first"
evidence = [
  { commit = "7ece3d7", function = "ox::game::CConfiguration::getBlock(const wchar_t*)" },
  { commit = "3708bf8", function = "harvest::game::CWorld", note = "unit definitions reordered to the build's order" },
  { commit = "e4b0712", function = "harvest::gui::CMainMenuScreen", note = "restored definition order" },
  { function = "std::__final_insertion_sort for CVideoNull::SSurface", note = "hv search at 69ea9eb: defining CVideoNull::setInputTexture earlier made this libstdc++ instance exact, so order also steers template code whose source is fixed" },
  { function = "daisy::scene::CParticleSystemSceneNode::reallocateBuffers", note = "At target address 0x56d4b0, the 470-byte function matches when defined before doParticleSystem and its two Irrlicht set_used calls become reserve. The target calls vector::reserve at 0x5701e0 and 0x570760 and never changes the buffers' logical sizes. Seeding learns the previously unnamed function and the vertex reserve callee, giving 59/60 exact functions in the unit." },
  { function = "daisy::scene::CMeshSceneNode destructor variants", note = "Defining the destructor before the constructor restores the target's destructor exception-table order. Four differing bytes otherwise reject the entire 173-byte .gcc_except_table section at 0x6636d2 even when all three destructor bodies match." },
  { function = "daisy::io::CZipReader sort helpers", note = "The unit has 30 functions, 24 exact and six inexact: scanLocalHeader, four SZipFileEntry std::sort helpers and vector::insert_aux. phase reports 24/30 exact, 0 locked and 0 witnesses. scratch-history records 101 actual scratch searches and 0 failed resets; selected events in both helpers come from CString assignment at CString.h:119, and the event before introsort_loop is in CZipReader::scanLocalHeader. This is the candidate compiler trace, not a target history. The method order differs from the bundled ancestor after the constructor: the current source puts scanLocalHeader before the destructor and extractFilename. concord sweep with 128 orders, 2 restarts and seed 0 plateaued with 0 exact gains. No source or order candidate was retained, so no oracle or normalized score gate ran; there is no gate summary line." },
]

[[idiom]]
id = "result-flag-or-early-return"
cause = "block-order"
status = "confirmed"
symptom = "the blocks of a switch's cases, or its lowering, differ: a compare chain against a lookup table, or case bodies laid out in another order"
fix = "Try the other exit style. A switch whose cases `return true` lays out differently from one whose cases set `result = true; break;` and return once at the end, and a result flag can let GCC turn a switch into a lookup table where early returns keep a compare chain."
before = "case ID_BACK: removeWindow(); return true;"
after = "case ID_BACK: removeWindow(); result = true; break;"
evidence = [
  { commit = "69e27c1", function = "harvest::gui::CProfileScreen::OnEvent", note = "result flag matched" },
  { commit = "4f54643", function = "harvest::gui::CStatisticsScreen::OnEvent", note = "early return kept the compare chain; a result flag became a lookup table" },
]

[[idiom]]
id = "switch-or-if-chain"
cause = "block-order"
status = "confirmed"
symptom = "tests on one value happen in a different order, or a compare chain appears where the target branches differently"
fix = "Write tests on a single value as a switch instead of an if/else-if chain, or the reverse. GCC 4.4 lowers the two forms to different compare orders and block layouts."
limits = "At setMeshToRenderFrom, the switch matches the Irrlicht 0.7 ancestor, but two authored if forms both score 92.0941 against the 99.62 baseline. Neither source form is established as a fix."
before = "if (event.GUIEvent.EventType == EGET_BUTTON_CLICKED) { ... } else if (event.GUIEvent.EventType == EGET_MESSAGEBOX_YES) { ... }"
after = "switch (event.GUIEvent.EventType) { case EGET_BUTTON_CLICKED: ... break; case EGET_MESSAGEBOX_YES: ... break; default: break; }"
