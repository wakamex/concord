[[idiom]]
id = "shared-callee-kept-out-of-line"
cause = "inlining"
status = "confirmed"
symptom = "an inline copy has the right body on both sides but the target keeps calls to a weak copy it also emits, while our build inlines the callee everywhere and emits no copy; the daisy gui units call std::list<ox::gui::IGUIElement*>::erase (the 54-byte copy named _M_erase at 0x4ff6b0, which returns the next iterator like erase), ox::IUnknown::drop (35 bytes at 0x4c6690), CString<wchar_t>::operator= through a 9-byte IGUIElement::setText thunk, ox::TArray's copy constructor and std::__uninitialized_move_a out of line, and we inline them all"
fix = "Give the callee another pending caller in the unit. GCC 4.4's early inliner (INLINE_SIZE) skips inlining when inlining would grow the caller and cgraph_estimate_growth(callee) > 0, which holds while the callee has enough uninlined callers to keep its out-of-line copy needed. Reproducer: two callers of std::list<E*>::erase inline everything and emit no copy; a third caller makes the compiler emit the weak erase copy and keep all three calls, with removeChild tail-calling it and bringToFront calling it, the exact target shape. In the target's CGUIEnvironment.cpp the copy is called three times: IGUIElement::removeChild, bringToFront and CGUIEnvironment::removeChild, which inlines the base removeChild. In units with only two emitted call sites the third caller must have had an erase edge at early inlining that the main inliner later inlined, or a body the unit no longer has. IUnknown::drop needs no extra explanation: it has many callers in every gui unit, so its growth stays positive."
limits = "The third caller in CGUIWindow and the other non-overriding units is not yet identified; removeAllChildren and ~IGUIElement are ruled out because their exact target copies do per-node operator delete (clear inlined), and no emitted target function besides removeChild and bringToFront calls the copy there, so the missing edge belonged to a body inlined away before emission or no longer present. Taking the callee's address in the unit (forcing its weak copy to be emitted) does not make GCC 4.4 prefer the call at other sites, so emitted-elsewhere neededness is not the mechanism. concord phase finds no locked function in the four gui units, so it is not the declaration count. Swapping the daisy header include order changes nothing. concord destructors shows the fat IGUIElementD2 body lands in different destructor clones per unit (IGUITabButtonRowD0 in CGUITabControl, IGUIWindowD1 in CGUIWindow, IGUIElementD2 itself in CGUIEnvironment) and that declaring or outlining a base destructor moves it, but every tested form trades a new exact copy for an exact 33-byte deleting destructor that goes fat: +2 functions against 1 worse in each of IGUIWindow and IGUILayout on CGUIWindow, which the no-worse rule rejects. The deciding pass is pass_early_inline inside pass_all_early_optimizations (the .einline2 dump; pass_ipa_early_inline never runs because its gate needs profiling flags). There _M_erase is inlined into the public erase wrapper and erase into each caller. For the copy to survive, _M_erase needs a direct caller still pending when erase itself is einlined: only list::pop_front, pop_back, remove, remove_if and unique call _M_erase directly (remove uses it twice), while every other erase-family call routes through the erase wrapper. A Children.erase caller helps erase's own growth but cannot keep _M_erase out of erase's body. A caller added to ~IGUIElement is decided after erase and is itself inlined (the destructor clone grows), so it does not count; the edge must sit in a body processed before erase, which cgraph order makes a late-created node, such as a daisy-side method. Dead calls (an empty check after Children.clear()) are eliminated before the pass and never create the edge. Overlay experiments on CGUIWindow.cpp at e0b3763 sharpen this: a third live Children.erase edge in the CGUIWindow constructor or in CGUIDetachableFrame::OnEvent makes GCC emit the 54-byte weak copy and gives bringToFront its byte-identical 113-byte target shape (loop, call to the copy, then operator new and hook inline for push_back) with removeChild at 87 bytes, but the emitted symbol is list::erase (5erase) while the learned symbol at 0x4ff6b0 is named _M_erase, so the copy cannot place there and the calls resolve elsewhere; removeChild would also need drop out of line. Direct _M_erase callers (pop_back, pop_front, remove, unique) were tried in stopDragging, the CGUIWindow constructor, both draw bodies, snapToItem, lockToItemInside, setAnimations and the CGUIDetachableFrame::OnEvent focus-lost branch: every edge is inlined away and no _M_erase, pop_back or remove copy is ever emitted, so the _M_erase name stays unreachable through callers. The added edges do move the fat 341-byte IGUIElementD2 body between clones: with an edge in the constructor, OnEvent or lockToItemInside the thin D1 forms appear (IGUILayoutD1, IGUIWindowD1, IGUIDetachableFrameD0 and D1 newly exact, four functions) while IGUILayoutD0, IGUIWindowD0 and IGUIWindowD2 go fat and IGUIDetachableFrameD2 goes thin (four lost). The target's placement is fat at IGUIElementD2 (322 bytes), IGUIWindowD1 and IGUIDetachableFrameD2, with thin D0 and D1 clones tail-calling IGUIElementD2. Explicit in-class empty destructors ~IGUIWindow(){} and ~IGUIDetachableFrame(){} (Irrlicht's IGUIWindow declares the first) gain IGUILayoutD1 and IGUIDetachableFrameD1 but lose IGUIWindowD0 and D2; all three interface destructors plus an erase edge keep the baseline clone assignment while still emitting the erase copy."
evidence = [
  { function = "ox::gui::IGUIElement::removeChild and bringToFront", note = "inexact in every one of the 23 units that emit them at harvest 9f6fba6: ours calls _List_node_base::unhook and operator delete inline, the target calls erase and drop out of line" },
  { function = "daisy::gui::CGUIWindow.cpp", note = "at e0b3763 the target's unit keeps _M_erase (54 bytes), IUnknown::drop (35), CString<wchar_t>::operator= (205), CString<wchar_t>::~CString (18), TArray<IGUIElement*>'s copy constructor and destructor, __copy_m<IGUIElement*> and __uninitialized_move_a<TArray<IGUIElement*>> out of line; we emit all of them inlined. concord limits makes 11 functions exact under inline-unit-growth=0 or all-low (IGUILayout/IGUIWindow/IGUIDetachableFrame destructors, setText, both CString<wchar_t>::operator=, TArray's constructor and destructor, drop, __copy_m), but never removeChild or bringToFront. Overlay experiment: a live Children.pop_back() edge inside ~IGUIElement is itself inlined (IGUIElementD2 grows to 376) and does not keep _M_erase out of line" },
