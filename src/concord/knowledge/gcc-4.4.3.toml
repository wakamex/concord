[[idiom]]
id = "peephole2-unit-scratch-state"
cause = "register-allocation"
status = "confirmed"
symptom = "unchanged functions acquire different scratch loads or epilogue pops after other bodies are restored"
fix = "Trace the differing instruction before moving locals. GCC 4.4.3 peep2_find_free_register keeps a static search_ofs across functions; a successful search advances to the next allocation-order index, while a failed search resets it to zero. Register classes, mode and liveness filter that search, so counting successful calls modulo the hard-register count alone does not predict its state. Measure unit context rather than rewriting an exact shared header."
limits = "At Harvest 63bf9dc, both remaining reader blockers first introduce their differing instructions in peephole2 (pass 182). getNextTokenAsString has unchanged body text: its inlined CString copy-loop used-field load selects r9 instead of target r12. TArray<SXAnimationSet> D1 selects rbp instead of target rdi for an eight-byte stack adjustment. Neither function has an expand partition or an aligned frame-slot constraint. Each of the two bounded placement interventions measures 70 sibling positions, moving the token-reader definition and then its owning reader destructor, with no improvement over the restored parser order. The normalized gate against 63bf9dc still reports 28 newly matched, 2 worse and matched data +1960/-0 bytes. Both stop without retained source changes; the seven parser stubs remain. A scratch-state padding census is untested and lies beyond these two interventions."
evidence = [
  { commit = "63bf9dc", function = "daisy::scene::CXFileReader::getNextTokenAsString and ox::TArray<SXAnimationSet>::~TArray", note = "Fresh canonical and diagnostic objects agree for both functions. Real dump fixtures preserve the csa and peephole2 function sections and their source hashes; tests identify peephole2 introduction rather than IRA allocation. The source constructs are CString.h's used-count copy loop and TArray.h's destructor epilogue. Both placement searches retain current as their best candidate against unchanged reference source." },
  { function = "GCC 4.4.3 peep2_find_free_register", note = "Primary source: https://github.com/gcc-mirror/gcc/blob/releases/gcc-4.4.3/gcc/recog.c#L2930-L3027 . search_ofs is local static state. Success stores the next raw register index, using reg_alloc_order where configured. Failure sets search_ofs to zero. There is no per-function reset of this local static variable." },
]


[[idiom]]
id = "peephole2-complete-search-history"
cause = "register-allocation"
status = "confirmed"
symptom = "RTL dumps omit unsuccessful scratch searches and cannot determine the unit-wide incoming search position"
fix = "Use concord scratch-history to observe entry and return of every peep2_find_free_register call in the hash-pinned GCC 4.4.3 binary. Complete object equality against the ordinary compiler invocation verifies the diagnostic execution, including Ubuntu driver defaults. Compare a target-exact reference function to obtain its incoming position, predecessor and changed prefix search counts. These are constraints on a source-order or body counterfactual, not a source fix by themselves."
limits = "Dumps alone cannot reconstruct failed searches or successful requests whose pattern is subsequently rejected. The observer supports the pinned x86-64 Ubuntu compiler only and requires GNU Debugger on the host; private layouts reject other compiler hashes. The four canonical traces at Harvest 9dff9df contain 25 baseline-reader, 68 restored-reader, 78 Lua-manager and 106 video-null searches, with zero failures observed. Register availability and mode affect each result, so adding a fixed number of searches does not prove a desired choice. No source counterfactual is established and no Harvest change is retained. The two reader blockers and seven stubs remain."
evidence = [
  { commit = "9dff9df", function = "CXFileReader::getNextTokenAsString", note = "The exact baseline requests scratch at event 5 with incoming position 41 and chooses r12, after __uninitialized_move_a<SXAnimation> chooses r11. The restored unit requests at event 13 with position 38 and chooses r9, after AnimationKey's three searches at events 10..12 choose di, bp, r8. The instruction UID and CString copy-loop input pattern agree. Reports retain both complete prefixes and changed per-function search counts." },
  { commit = "9dff9df", function = "TArray<CXFileReader::SXAnimationSet>::~TArray D1", note = "The exact baseline epilogue requests at event 1 with incoming position 5 after validateMesh chooses si, and selects di. The restored unit requests at event 63 with position 6 after parseDataObjectMesh chooses si then di, and selects bp. Both refer to UID 97. This is changed expansion context rather than a changed destructor declaration or frame partition." },
  { commit = "9dff9df", function = "CLuaManager and CVideoNull", note = "The complete canonical histories include searches in all 14 previously classified peephole2 functions. includeMod's first three recorded copy-loop choices start at position 38 and choose r9/r10/r11; refreshAvailableLuaMods starts at 4 and chooses si/bp. Video insertion/sort helpers and sprite/particle package lookups expose their CString loop requests. The two mixed expand/IRA functions, harvest_getSelectedBuildings and runPPShader, contain no scratch requests. A target-exact reference history for these larger groups is unavailable, so an original-source correction is unresolved." },
  { commit = "9dff9df", function = "CXFileReader restored unit, order counterfactuals", note = "With the authored == material check and seven bodies applied, the live trace has getNextTokenAsString at before 42 picking dx after SXSkinWeight C1 picks r12, and TArray D1 at before 6 picking bp after parseDataObjectMesh picks si then di. Moving the token reader after validateMesh emits it after AnimationKey but shifts the upstream stream: G at before 38 picking r9 and D1 at before 1 picking dx. Moving it after AnimationKey or MeshTextureCoords gives the same emit slot and G at before 38, D1 at before 6. A full definition order matching the target binary's own-function layout leaves the same emit slots; GCC caller-DFS postorder, not definition order, fixes them. The target's layout also shows no SXC1, uninit_copy_a<SXAnimation>, vector<SXAnimation>::operator=, move_a<SXAnimationSet>, insert_aux<SXAnimation>, insert_aux<SXMaterial> or subString copies from this unit, while the restoration emits all of them, so a parser body rather than an order is the remaining lever. Neither order candidate reaches before 41 or 5, both interventions fail and no Harvest change is retained." },
  { commit = "9dff9df", function = "CXFileReader copies: all seven sit in the target's span", note = "FDE extents plus the call graph identify every 'surplus' copy inside the unit's own span: SXAnimation C1 0x594960 (374, same size as ours), uninit_copy_a<SXAnimation> 0x594340+0x594510 (453 each, ours 517), vector<SXAnimation>::operator= 0x5946e0 (636, ours 841, calls 450320/593ef0/594340/594510), uninit_move_a<SXAnimationSet> 0x595140 (893, ours 925, called twice from insert_aux<SXAnimationSet>), insert_aux<SXAnimation> 0x597380 (1553, ours 1623, called from the AnimationSet parser's full-vector branch), insert_aux<SXMaterial> 0x596e80 (1279, ours 1423, called from MeshMaterialList). subString's two out-of-line call sites bind to the kept copy at 0x4528e0 in CLuaManager's span; the unit still emitted one. The 'surplus' verdicts were unplaceable size mismatches, not absent code." },
  { commit = "9dff9df", function = "CXFileReader MeshNormals and AnimationSet restored sizes", note = "In the restored unit ordered to the target binary's own-function layout, MeshNormals emits 1785 against 1801 bytes: the normals-read loop keeps the out-of-line fast_atof_move call for the first coordinate read in the target but for the second in ours; the index loops are instruction-identical. AnimationSet emits 1165 against 1101: inside set.Animations.push_back(SXAnimation()) the inlined SXAnimation copy keeps CString<char>::operator= as an out-of-line call in the target, one of only two operator= call sites the unit keeps, while ours inlines it (~64 bytes). Both are inliner edges on shared callees, not body-level source differences; the bodies are the faithful Irrlicht 0.7 translation. Candidate spellings evaluated: insert(end(), SXAnimation()) 1274 at 48.21, named SXAnimation local 1301 at 35.62, named CVector3d reference 1997 at 72.71, swapped indexcount compare operands neutral at 80.31. Neither intervention per function reproduces the target shape; no source change is retained." },
  { commit = "9dff9df", function = "CXFileReader copy constructs match the target", note = "Target call sites confirm the ancestor's constructs: parseDataObject calls SXMeshC1Ev/SXMeshC1/SXMeshD1 x2/insert_aux<SXMesh> and SXAnimationSetC1/SXAnimationSetD1 x2/insert_aux<SXAnimationSet>; parseDataObjectFrame calls insert_aux<SXFrame>+SXFrameC1 and insert_aux<SXMesh>+SXMeshC1; parseDataObjectMesh calls SXSkinWeightC1/SXSkinWeightD1 x2/insert_aux<SXSkinWeight>; MeshMaterialList calls insert_aux<SXMaterial>; AnimationSet parser builds an SXAnimation temporary (rep stos plus new char[1]) then an inlined copy construct and _M_insert_aux<SXAnimation> on the full path. Every append is push_back of a default object then index; no reserve, resize or different container appears. The copies' size differences are inlining edges inside identical instantiations (our insert_aux inlines CString::operator= where the target calls 0x450320), not source constructs, so no parser-body change removes them." },
  { commit = "9dff9df", function = "CXFileReader shared callee copies", note = "The 283-byte fast_atof_move copy matches the target at 0x5930c0 with relocations masked, including three strtol calls and one pow call. Its 16-float table matches target 0x61c8e0, and the sign mask and 10.0 constant match. Concord diff reports score 100 but exact false because the table's local .rodata address is unplaced. CString<char>::operator= has 110-byte copies in seven units against target 0x450320, all calling delete[] and new[]. CLuaManager, CPlayState and CHTTPConnectionHandler are exact. CAchievementsScreen and CSaveGameScreen use esi instead of edx for the used-count load at +0x2d and its test at +0x37; CGUIEnvironment uses r9d and CVideoNull uses r8d. Concord causal traces the CAchievementsScreen change to peephole2 at CString.h's copy loop. These copies show the definitions can produce the target machine code, not that the original source spelling or GCC's inliner estimates are proven identical. Different inliner edges alone do not establish a header defect." },
  { function = "GCC 4.4.3 peep2_find_free_register", note = "Primary source: https://github.com/gcc-mirror/gcc/blob/releases/gcc-4.4.3/gcc/recog.c#L2930-L3027 . Both return paths are observed directly. No dump statement records an unsuccessful search or its reset. The compiler executable SHA-256 is cbd886f07b000b49ffd7d3f41ef42f27c8c286e6b597d79b21a35010b84a584c." },
]
