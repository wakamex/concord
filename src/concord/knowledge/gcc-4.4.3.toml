[[idiom]]
id = "lua-manager-unit-recovery"
cause = "inlining"
status = "hypothesis"
symptom = "CLuaManager.cpp has differently distributed string copies across its mod loader, save-table traversal and vector helpers, alongside smaller register and control-flow differences."
