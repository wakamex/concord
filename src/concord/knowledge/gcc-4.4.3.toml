[[idiom]]
id = "bsp-tree-splitpoly-residual"
cause = "instruction-selection"
status = "confirmed"
symptom = "At Harvest a3b9f79, daisy::scene::CBspTree::splitPoly is a 3,527-byte target at residual score 50.79 with 21 data rows, the most of any inexact function in the unit."
fix = "Copy the current vertex into a local currentVertex and build the split vertex from its normal (reading only Normal.Y from the copy is also exact, but all three components read naturally and Harvest a10b927 uses that form), reverse the first between-points comparison's operand order, and cast backSplit.vertices.size() to int before multiplying by 3 and subtracting 6. These authored forms compile splitPoly to the target's exact 3,527 bytes. The bundled [Irrlicht 0.7](https://irrlicht.sourceforge.io/) ancestor has none of the corrected forms, so no translation rule applies."
limits = "After splitPoly matches, findSplitter and polyExistsInNode are the unit's only inexact functions. Their calls, constants and data references match the target, but their remaining register and branch rows have no established source cause. The 128-candidate permute search on the size_t temporary form found no improvement. Stop work on these siblings until a source hypothesis explains their specific residual rows."
evidence = [
  { function = "Initial residual", note = "At Harvest a3b9f79, splitPoly has 3,527 target bytes, 3,492 candidate bytes and residual score 50.79. Its 21 data rows and 303 register-choice rows make it the largest inexact function in the unit. The initial calls-constants audit compares three inexact functions and finds splitPoly alone differs: the target frame is 0xbd8 bytes and the candidate frame is 0xbc8. No call, non-frame constant or external data-reference difference appears." },
  { function = "Vertex local", note = "Copying poly.vertices[currentIdx] into currentVertex before using currentVertex.Normal.Y is an authored source correction. The author score rises from 94.51469 to 94.7765, and the residual score rises from 50.79 to 50.92. The 5,000-case oracle agrees. The whole-build gate exits 0 with: 1 functions changed: 0 newly matched, 0 worse; data bytes matched: +0 -0." },
  { function = "Intersection comparison", note = "The Irrlicht 0.7 ancestor's isBetweenPoints uses distance(begin) < lengthSQ and distance(end) < lengthSQ, which matches the original translation and does not provide the target's first comparison spelling. Reversing that first comparison's operands is therefore authored. The author score rises from 94.7765 to 99.9106, and the 5,000-case oracle agrees. The whole-build gate exits 0 with: 1 functions changed: 0 newly matched, 0 worse; data bytes matched: +0 -0." },
  { function = "Index count", note = "The original candidate computes (backSplit.vertices.size() - 2) * 3 and emits imul by 0xaaaaaaab followed by sub 6 at +0xaad and +0xabe. The target emits imul by 0x38e38e39 and lea with a three-times scale and -6. The uncast rewrite size() * 3 - 6 reproduces those two target instructions but lowers the author score from 99.91571 to 99.9106, so author rejects it before the oracle. Casting size() to int before multiplication gives int backIndexCount = (int)backSplit.vertices.size() * 3 - 6; author raises the score from 99.91571 to 100.0 and reports an exact match. The bundled ancestor retains (size() - 2) * 3, so this is an authored correction. The final gate exits 0 with: 1 functions changed: 1 newly matched, 0 worse; data bytes matched: +0 -0. An oracle run is unnecessary for this exact candidate." },
  { function = "Final unit audit", note = "The refreshed hv match reports 34/36 exact functions in daisy/scene/CBspTree.cpp; splitPoly is exact. The final gate reports: 1 functions changed: 1 newly matched, 0 worse; data bytes matched: +0 -0. calls-constants compares the two remaining inexact functions and finds zero differences. findSplitter scores 99.22 and retains two register-allocation rows at +0x2a for a zero stack store. polyExistsInNode scores 96.89 and retains register-allocation rows at +0x1b6 and +0x2a6 plus target-only and candidate-only parity branches at +0x1ec and +0x1f8. No source correction for either sibling is established. Both port builds pass with -j2, git diff --check passes, and the Harvest toolchain suite reports 232 passed and 3 skipped." },
]

