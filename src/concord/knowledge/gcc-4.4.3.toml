  { function = "Rejected search", note = "permute --unit uses budget 128, batch 16, depth 3 and seed 0 on the lifetime-corrected source. Its chosen source swaps the gun's coordinate declarations and changes both landing-angle comparisons to unordered-inclusive predicates. The automatic gun-range repair lowers that search candidate's original-image disagreements from 13 to 10 on 5000 cases. The complete candidate has objdiff 87.697556 against the retained 86.736885 and the target's 5962-byte size, but fails the final oracle: 15 differing cases, zero undefined cases, and original-image disagreements increase from 5 to 10. Nothing is installed. Combining the two angle exclusions into one negated outside-range predicate compiles identically; state-4-first, cooldown-first and both orientations score 87.375, 84.05769 and 83.861015 and supply no rescue. These overlays remain rejected with the searched candidate. A local repair relative to a mutated source cannot replace comparison with the retained source. The retained source remains 5978 bytes and 53/55 unit functions remain exact." },
