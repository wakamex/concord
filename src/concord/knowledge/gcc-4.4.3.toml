limits = "A higher instruction-alignment score need not improve objdiff: distributing idle ranges raises secondInit's Concord score from 86.48 to 86.89 but lowers objdiff from 59.48062 to 58.497673. Judge the whole build by scores --base and matched data, rather than the alignment score alone. Diagnostic compiler histories describe the candidate, not the target's source."
evidence = [
  { commit = "99cfd16", function = "Unit context", note = "The unit emits 32 functions, 28 exact, including six placed inline/template copies. The Mac order differs at createEditProfileWindow/createProfileListWindow, fillLayoutWithPlanetInfo and the render methods; its full definition-order overlay gains nothing and loses exact placement verdicts for fillLayoutWithPlanetInfo and createLockedPlanetMessageBox despite their objdiff scores staying 100. Companion-first include order gains nothing. All 31 declaration-count phases have zero locked functions and zero witnesses. statics finds 27 same-layout objects across 97 aligned references, with identical object order in .bss, .data and .rodata. .bss is exact at 0x86bd60, 160 bytes; .data is exact at 0x868e20, 392 bytes. The 1328-byte .rodata at 0x608020 contains code-dependent jump tables and remains inexact. place-bss learns zero placements and place verifies zero new called sections. Layout finds zero differing memory bases in secondInit. The vtable census compares 350 tables and reports only the existing CVideoSoftware slot-11 difference. No header, symbol, placement or compiler-option correction is supported by these checks." },
  { function = "CMainMenuState::secondInit", note = "The target is 6565 bytes at 0x499c10; the baseline emits 6557 bytes, Concord 86.48 and objdiff 59.48062. Calls and constants agree. The first differing block is target +0xca0, case 36, placed at candidate +0x11f0. Giving each of the 20 idle cases its own return 2 reaches Concord 99.76 and objdiff 99.120155. Its oracle agrees on 5000 cases with zero differences or undefined cases, but the whole-build gate rejects the combined trial for 17 lost data bytes. A 128-candidate post-correction search gains nothing. The combined condition g_scenarioResult == 1 && g_scenarioResultGameMode == 5, followed by the existing else-if for results 3 and 4, fixes the remaining cold return and cleanup placement and makes the complete function matcher-exact at 6565 bytes, objdiff 100. This authored correction needs no oracle because the matcher proves its bytes. The old nested condition and separate idle returns alone emit 6589 bytes: the target return-1 block is at +0x1460, the candidate puts it at +0x1490, and later literal references move. Separate idle cases in numeric order give the same score and data loss. A scenario-result switch reaches 98.9186, loses a placement verdict and still loses 17 unit data bytes. Moving high cases, an explicit default, scoped returns, positive mesh/font/package guards and added case scopes gain nothing; a shared loading return falls to 39.537983. Statistics-first tests reach 99.13178 and independent result tests 99.111626; neither is kept." },
  { function = "CMainMenuState::OnEvent", note = "The target is 5013 bytes at 0x49e160; the baseline emits 5029 bytes, Concord 79.31 and objdiff 52.809746. Calls and literal identities agree; calls-constants flags only the 0x1a8 target frame versus 0x1b8 candidate frame. Signedness finds no aligned pairs. The two enum-switch int casts leave size and score unchanged, as the earlier audit found. Independent key-press and key-release tests raise objdiff to 72.78163; naming the empty CString used to clear HeadingText on game-mode selection raises it further to 73.2493. Author verifies each inexact keep against its preceding form with 5000 agreeing cases, zero differences and zero undefined cases. Both forms preserve every emitted function score and lose zero unit data bytes on the baseline source. Mouse dispatch as a switch reaches 62.847237, but combining it with independent key tests falls to 59.183693. Key dispatch as a switch falls to 52.58107, independent mouse tests to 52.753513, shaded-rectangle reference passing to 51.833176 and separate mouse-position scopes to 52.02718. Two 64-candidate searches identify the named-string form. A byte-verified causal dump and frames identify 18 baseline expand partitions and 22 aligned slot constraints. The aligned rectangle at target +0x4ef is introduced by split2 and attributed to a draw argument. The final source emits 4990 bytes and reproduces the target 0x1a8 frame. Concord instruction alignment falls from 79.31 to 69.73 despite the higher objdiff score. With that frame corrected, the final dispatch matrix gives heading-only 53.0478, heading plus a mouse switch 62.631676 and heading plus both dispatch changes 59.24742, all below the kept independent-key form at 73.2493. The remaining stack slot assignments, GUI dispatch block order and register differences still lack a proven source correction; the trace describes the candidate rather than the original source." },
  { function = "CMainMenuState::enterGameModeSelectMode", note = "The 1938-byte target at 0x49d060 differs from the 1934-byte candidate only in its first wide-string construction and setText dispatch sequence: Concord 96.95, objdiff 97.1. The reported extra indirect call is a call-through-memory versus load-and-call-through-register form, not a missing GUI operation. Causal traces put the loop comparison at CString.h:159, where a recycled SSA version reverses the operand order during vrp1 and ch mirrors the condition. The caller search measures 59 overlays, zero eligible; a separate 64-candidate permute search also gains nothing. Copy initialization, explicit temporary construction and direct initialization of the same literal preserve the score; an inline call temporary falls to 95.586845 and narrowing the literal falls to 94.357895 while lowering OnEvent. No shared string-header correction is established." },
  { function = "CString<char>::operator+=", note = "The sole emitted copy at 0x49f5c0 is 230 bytes on both sides, Concord 97.33 and objdiff 99.10256. Its only difference is cmp eax, ebp / jle against cmp ebp, eax / jge. None of the 31 declaration-count phases makes it exact. Header changes are outside this unit's permitted source scope, and no caller-context correction for this comparison is proven." },
  { function = "Rejected data regression", note = "The intermediate separate-idle-return and independent-key candidate passed the unit score and oracle checks but failed the whole-build gate: 2 functions changed: 0 newly matched, 0 worse; data bytes matched: +91 -17. Both source edits were reverted. The 17 lost bytes lie at 0x6071d9 (5 bytes of AtrumBlack) and 0x6071fd (12 bytes of ConsolText_). In the near-exact initializer, the corresponding cold literal references move to candidate offsets +0x1860 and +0x1641 and no longer identify those strings at their target positions. Correcting the combined condition makes secondInit exact and removes this data regression. The data-only rejection is one failed chosen intervention; the subsequent forms are measured as overlays before another whole-build candidate is chosen." },
  { function = "Whole-build gate", note = "The final scores --base 99cfd16 gate exits 0: 2 functions changed: 1 newly matched, 0 worse; data bytes matched: +91 -0. No configuration changes. The unit matcher reports 29/32 exact and exits 1 for the three recorded residuals. The newly exact function contributes 6565 target code bytes. Both port builds, harvest and census with -j2, pass; the Harvest toolchain suite passes 232 tests with 3 skips. Both repository diffs pass whitespace checks. Final CMainMenuState.cpp SHA-256 8a4070a546268273aba3810f18411afb144c97cc59170fae7028d16eecc9f627. Only this source changes in Harvest; its header, placements and symbols remain unchanged. All accepted edits go through author; secondInit is exact, and the final OnEvent candidate has 5000 agreeing oracle cases with zero differences and zero undefined cases." },
  { function = "Effective compiler inputs", note = "Pinned g++ (Ubuntu 4.4.3-4ubuntu5) 4.4.3, -O2, -Isrc, -Isrc/HarvestFull, -Ithird_party/luajit-2.0.0-beta8/include. Container image SHA-256 b94ef6033199879fb811edc1d642923532b9213f245eb081646157559e3d45dd. Baseline CMainMenuState.cpp SHA-256 1b899c16c69b74756ab54f48890bde526596eae083d0d97298206ec6357d0fcd; CMainMenuState.h 8e6644312e7ba933e3452a41b0148c659b30317c0ae0cf93f6a82a6094c06712; CString.h 7cc2521534a1b7864708fdc416a25279f05507d6c045abeca04545f4a88b95ee; flags.json 9ebb8c16c904108ddb5cbaa50345a733d400ee2bd3994c72e5545e676fb03ad8; units.toml 3778e24f111650836f8595ff618bd1661fc73ff02178f0c91e1a34d123a81f32; symbols.tsv 3b156c561057e2eac32112e9abbb0b842174d530df82b1ae1bd37091eaa5c21d. The canonical OnEvent code hash is f67a019cf59174b3556c8b920b8b029e5c9a613f816b9eeeb2f74b39c40c35d3; enterGameModeSelectMode is 2d0492fc0ab98409596aef2c0bbc127a767449d549ebf10c54dad65dc10cc8b5. Diagnostic code and relocation offsets are verified against the canonical compiler invocation." },
