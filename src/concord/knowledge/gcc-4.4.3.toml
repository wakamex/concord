[[idiom]]
id = "inline-in-header"
cause = "inlining"
status = "confirmed"
symptom = "a call on one side where the other side has the callee's body inline, or the reverse"
fix = "Define the callee where the original did: inline in the class definition or an included header lets GCC inline it at -O2, an out-of-line definition in another unit prevents it. Match the original header layout (the Mac debug map's N_SOL header markers show which headers contributed code)."
evidence = [
  { commit = "0003aa9", function = "ox::gui::IGUIElement and IGUILayout", note = "inline method bodies added to IGUILayout.h, as in the original headers" },
]

[[idiom]]
id = "named-temporary"
cause = "register-allocation"
status = "hypothesis"
symptom = "a repeated subexpression is recomputed on one side and kept in a register on the other, with spills or copies around it"
fix = "Introduce or remove a named local for the repeated subexpression. GCC 4.4's common-subexpression elimination does not always merge repeated array indices or member loads, so a local changes what stays in a register."
before = "MiddleTargets[NextCheckPoint % 14].X = ...; EndTargets[NextCheckPoint % 14] = ...;"
after = "int next = NextCheckPoint % 14; MiddleTargets[next].X = ...; EndTargets[next] = ...;"
evidence = [
  { commit = "9edc1d4", function = "harvest::entity::CShuttleEntity::updateLogic", note = "not isolated from the other changes in the commit" },
]

[[idiom]]
id = "thunk-without-unwind-entry"
cause = "placement"
status = "confirmed"
symptom = "a this-adjusting thunk (_ZThn..., _ZTv...) whose bytes match but which the matcher cannot place at an unwind entry"
fix = "No source change: GCC 4.4 emits no unwind-table entry for thunks, in the original or in a recompile. Harvest's matcher proves a function's extent by its unwind entry, by design, so thunks stay inexact there even when their bytes match. Their extent is provable another way: the thunk ends at its jmp, and a slot in its class's vtable points at it."
evidence = [
  { function = "about 230 thunks across Harvest units", note = "bytes identical to the target; no FDE on either side" },
]

[[idiom]]
id = "inliner-pass-operand-order"
cause = "operand-order"
status = "hypothesis"
symptom = "swapped compare operands inside an inlined callee's code, where other functions that inline the same callee match"
fix = "Trace the inlined loop's single static assignment (SSA) names through value-range propagation (vrp1) and loop-header copying (ch). Recycling can reverse a comparison in one copy while another call with the same argument matches. A source correction remains unidentified; accept a caller change only when it matches or improves under the oracle and preserves the other scores."
limits = "`concord survey --lines` puts 84 operand-order findings in 30 functions on one line, CString.h:159 (the copy loop of operator=(const B*)), and 41 more on CString.h:186-187 (operator<). Rewriting those lines in the header, judged by exact functions over all 110 units that include it, never gained: `l <= len` and swapped spellings compile to the same bytes, `l < used` lost 333 exact functions for 3, an unsigned counter lost 308 for 9, and Irrlicht's original append (len = other.size() + 1) lost 84 for 6. Caller-side no-ops in CMineralGatherEntity's constructor (a dummy local, braces, an implicit conversion, a const char* local) left its swapped compare in place, and naming the temporary or reordering statements made it worse. The header as written is the best uniform form, so inspect the caller's compiler state before changing it."
evidence = [
  { function = "harvest::entity::CSparkMoverEntity and CMineralGatherEntity constructors", note = "only the first inlined CString copy loop has cmp len, i; single-string constructors match (harvest docs/matching.md)" },
  { commit = "823b979", function = "CStringFunctions::millisecondsToWide", note = "At 0x5e08d0 the 4,325-byte function scores 99.93924 by objdiff. Its two differing bytes are 0xc5 and 0x7d in the target versus 0xe8 and 0x7e in the candidate at 0x5e0e48 and 0x5e0e49: cmp ebp, eax; jge becomes cmp eax, ebp; jle. The matcher reports no bad references or unplaced sections, and calls-constants finds no call or constant difference. A canonical-byte-verified diagnostic maps both instructions to CString.h:159 in the construction of L\".0\" at CStringFunctions.cpp:39. The candidate's 059t.mergephi2 has len_675 >= l_689; 060t.vrp1 creates len_929 from len_675 and 066t.ch has l_697 <= len_929. The change in SSA numbering and comparison is observed in the candidate; the original compiler history is unknown. All 31 declaration-count phases produce identical function code and remain inexact, and the verified scratch history records 12 searches, no failed resets and no scratch request for either differing instruction. Three earlier 256-candidate permute runs, one 128-candidate run and four comparison rewrites made no gain; their concord instruction-alignment score stayed at 99.82. No source correction is retained. The normalized unchanged-source gate reports 0 functions changed: 0 newly matched, 0 worse; data bytes matched: +0 -0. The compiler is g++ (Ubuntu 4.4.3-4ubuntu5) 4.4.3 with -O2 and the default -fstack-protector, from image SHA-256 b94ef6033199879fb811edc1d642923532b9213f245eb081646157559e3d45dd. Source SHA-256 is b235c79e0be7e796ea95743e63c8ba44b4db497dc8fb1dfe7936fd9bd766ffb9; the diagnostic function code SHA-256 is 851ccad5f241f4028144ab3a62dd72050141fb2bc18ec345bf55f85e94b69b4f; the canonical object SHA-256 is 1355966244fed8f8fbed033a6c3664e0a4fd9a1cbe7f6d7fea70ce5e1d0b83bd." },
  { function = "seven functions whose only differences are operator=(const B*) copy loops at CString.h:159", note = "Measured negative at b0464ee, mechanism corrected at 048e50d on CBase64url::encode2's -fdump-tree-all dumps: every inlined copy carries `len >= l` with the lower SSA version on len through 059t.mergephi2. The exit PHI that rewrite_into_loop_closed_ssa creates in 060t.vrp1 for the post-loop len (`while (*p) ++len;`) takes a recycled SSA version from FREE_SSANAMES rather than a fresh one (the unit's highest version stays 913), so len ends up with the higher version, and tree_swap_operands_p in 066t.ch and 113t.dom2 swaps the test to `l <= len` per copy. Not a value-numbering or call-site decision. String literal calls sit in both groups: the .0 call flips and the . call matches (millisecondsToWide lines 39 and 41), and identical Base64Alphabet2[...] calls match in the while loop but flip at the first call of each switch case (encode2 lines 87 and 93). About fifty caller-side variants across five units (named const pointer, named CString temporary, cast, implicit conversion, swapped branches, statement and definition order, dead and live padding, init-list members, chained stores, loop forms) and 128 permute candidates left every site's operand order in place. phase shows no declaration lock." },
  { function = "the same sites routed through CString<T>::operator+(const B*) or an append(const B*) member", note = "Measured negative at b0464ee on the different-inline-chain lead. The Mac map's CString<char>::operator+<char>(const B*), emitted only in COSXOperator.mm, is already in the header (upstream 858c93e); no other non-Mac member is missing. Every routing through a genuinely different chain collapses the match instead of flipping the compare: result + lit scores 25-80 of 99.82, a temp built by CString<T>() + lit scores 46-83, a ctor delegating to *this + c scores 37-66, a new append(const B*) member used as result.append(lit) scores 24-85, and Score = columns[2].c_str() without the temporary scores 68 of 99.70. A ctor carrying its own copy loop instead of *this = c compiles byte-identically in both entity constructors (GCC folds the delegation) and is worse elsewhere. Spellings that fold back to the same chain (result.append(L\"0\"), Response == \"Error\", addNewAnimationState(\"SparkMover\")) compile byte-identically with the flip in place. The original's flipping sites do go through operator=(const B*); the operand order is not a chain artifact." },
