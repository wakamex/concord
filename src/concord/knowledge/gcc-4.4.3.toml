  { function = "Unit context", note = "At Harvest 15d71bd, CDropshipEntity.cpp has 53/55 exact functions and 21 emitted copies, all placed. statics reports all four objects same-layout, including the 84-byte mineral-cost table and the three zero-initialized objects at offsets 0, 4 and 8. place learns zero called sections or literal repairs; place-bss learns zero addresses. The vtable audit has only the existing CVideoSoftware mismatch and layout finds zero differing bases in updateLogic. All 31 declaration-count phases have zero locked functions and zero witnesses. Source definition order follows the Mac map except getCollisionSize, defined in the recovered class but credited to the source file by the map. Moving that unchanged body after the destructor preserves every score in all four dependent units and gains nothing. Companion-header-first also gains nothing. Neither context form is installed." },
  { function = "CDropshipEntity::updateLogic landing", note = "The 5962-byte target at 0x42b890 branches from +0xb36 to +0xb7f when altitude is at least 15.0f, skipping both the final landing sprite assignment and pitch reduction. The recovered source had the pitch reduction outside that branch. The authored correction raises objdiff from 83.263985 to 84.0201, with 5000 agreeing differential-oracle cases, zero undefined cases and no lower unit score. Concord instruction alignment rises from 89.51 to 89.96. The generated oracle cases agree despite the assembly-proven scope correction; they are evidence of agreement on those inputs rather than proof over all states." },
  { function = "CDropshipEntity::updateLogic value lifetimes", note = "Keeping the approach alignment result in a bool restores the target's shared tail at +0x376 and raises landing-corrected objdiff from 84.0201 to 84.562065. Evaluating the gun sine before constructing its start vector raises it independently to 86.09703 and restores the target's vector construction after sin at +0xf90. Declaring missile Y before X independently reaches 84.118004 and restores the coordinate instruction order at +0x146d and +0x15cd. All seven combinations are measured as overlays; the three together reach 86.736885, Concord 92.84, with 5000 agreeing oracle cases and no other unit score lower. The candidate remains 5978 bytes, 16 above the target." },
