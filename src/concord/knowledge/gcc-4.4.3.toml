[[idiom]]
id = "ipa-inliner-distribution"
cause = "inlining"
status = "hypothesis"
symptom = "functions in a unit differ only in how many copies of a shared inline callee (CString<char>::CString(const char*), ~CString) the IPA inliner placed in each; total call sites agree with the target"
fix = "The deciding pass is pass_ipa_inline (042i.inline dump), which greedily inlines edges by badness until the unit growth passes inline-unit-growth (30%) of the starting insn count. Equal-badness edges are decided by fibheap order, which follows the order callers are walked: cgraph_nodes is a LIFO list, so callers are visited in reverse cgraph uid order, which is reverse DEFINITION order in the unit for the unit's own functions (nodes are created at definition, not at declaration). A definition-order change can move the distribution. Caller and header forms must be measured against the literal sites: a fuzzy gain need not change any inline choice."
limits = "Verified on CAlienEntity.cpp at harvest 048e50d (unit starts at 22513 insns and ends at 29299, exactly the 30% cap): include order (own header first), free declarations and unused static inline helpers before the unit, member declaration order and added member declarations in the class header all compile byte-identical. The unit's replaceWith* definition order matches the Mac map, and moving replaceWithTinySprites before replaceWithMegaSprites shifted copies (Magneto 14005->11717, Looker 7045->8917, Tiny 4549->5557, all still inexact; targets 12437/8485/4741), moving JammerSprite or SummonerSprites late improved Looker to 76.46 at size 7029, while moving Magneto earlier changed nothing. Raising the cap param (growth=31..35) only grows the tail callers (Tiny, then Looker), never shrinks Magneto, so the original's cap did not simply sit elsewhere: the measured declaration changes did not reproduce the target's distribution; missing body content remains a hypothesis rather than an identified cause. Do not reorder the unit to force the distribution; the map already shows the original order."
evidence = [
  { function = "harvest::entity::CAlienEntity replaceWith{Magneto,Looker,Tiny}Sprites", note = "ours 14005/7045/4549 bytes against targets 12437/8485/4741; the 042i.inline dump shows 57 CString-ctor copies popped for Magneto first; same 227 call sites on both sides" },
  { function = "harvest::entity::CDefenseTowerEntity C1/C2 and harvest::states::CPlayState::OnEvent", note = "same cause family per the second reader: C2 target 24437 vs 24325, C1 15365 vs 15573, OnEvent 13607 vs 13263, equal call counts on both sides" },
  { function = "harvest::entity::CDefenseTowerEntity constructors at Harvest 8c51527", note = "Both constructors use the same 147 sprite names in the same order as the target. C1 inlines 20 CString<char> constructions against 19 in the target, C2 106 against 107. All 13 emitted inline copies are placed and the shared CString copies are exact. The 31-phase declaration-count scan has no locked functions or witnesses. Companion-header-first changes neither constructor and lowers the static initializer from 100 to 99.818184; implicit sprite-name conversions compile identically. These are the two failed constructor interventions; no table or definition-order rewrite is retained. Restoring updateLogic's alpha declaration order, explicit clamp and firing-first sprite selection raises that function from 66.201164 to 77.44681 but leaves both constructor instruction streams and relocations unchanged. The original input that changes the equal-cost edge distribution remains unidentified; those logic source forms do not explain it." },
